# Telemetry profile: TR-098 system identity.
#
# Collects device identity, firmware, and uptime — the minimum set
# needed for fleet identity dashboards and firmware-distribution views.
#
# All params interval=0 (passive — one GPV per natural Inform session,
# no Connection Request scheduling).
#
# Scope: generic TR-098 baseline — match-all. Wildcard paths + standard
# InternetGatewayDevice.* schema means this is safe to ship against any
# TR-098-speaking CPE. Operators narrow scope in their fork by adding a
# deviceSelector (matchLabels / matchExpressions on manufacturer, model,
# firmwareVersion, tag:*, group_path:*, etc.).
#
# Priority 10 — operator-shipped vendor profiles (typical priority 50+)
# override on conflicting paths.
apiVersion: telemetry.herder.io/v1alpha1
kind: TelemetryProfile
metadata:
  name: tr098-system
spec:
  priority: 10
  deviceSelector:
    matchExpressions:
      - key: "dataModel:igd"
        operator: Exists
  parameters:
    # Identity, and it is NOT redundant with the devices row. A CPE
    # announces itself in the Inform's DeviceID struct, which Herder
    # persists as the device record, and the device page's status form
    # reads canonical.device.* instead, which resolves through
    # device_parameters. Without these the form renders a blank
    # Manufacturer, Model, Product class and Serial number on hardware
    # that has been telling us all four every session.
    - path: "InternetGatewayDevice.DeviceInfo.Manufacturer"
      interval: 0
    - path: "InternetGatewayDevice.DeviceInfo.ManufacturerOUI"
      interval: 0
    - path: "InternetGatewayDevice.DeviceInfo.ModelName"
      interval: 0
    - path: "InternetGatewayDevice.DeviceInfo.ProductClass"
      interval: 0
    - path: "InternetGatewayDevice.DeviceInfo.SerialNumber"
      interval: 0
    - path: "InternetGatewayDevice.DeviceInfo.Description"
      interval: 0
    - path: "InternetGatewayDevice.DeviceInfo.HardwareVersion"
      interval: 0
    - path: "InternetGatewayDevice.DeviceInfo.SoftwareVersion"
      interval: 0
    - path: "InternetGatewayDevice.DeviceInfo.UpTime"
      interval: 0
    # The inform schedule the CPE is actually running, which is the one
    # number that says whether a quiet device is broken or simply on a
    # long interval. Credentials in this subtree are deliberately absent:
    # a collected password is a password in telemetry history.
    - path: "InternetGatewayDevice.ManagementServer.PeriodicInformEnable"
      interval: 0
    - path: "InternetGatewayDevice.ManagementServer.PeriodicInformInterval"
      interval: 0
    # Remote-access posture. Collected with identity because the fleet
    # question ("how many gateways answer management from the WAN") is
    # a posture question, and the support question needs current state
    # before it can be changed. Bisect and the availability cache keep
    # a firmware without the object from poisoning the batch.
    - path: "InternetGatewayDevice.UserInterface.RemoteAccess.Enable"
      interval: 0
    - path: "InternetGatewayDevice.UserInterface.RemoteAccess.Port"
      interval: 0
    - path: "InternetGatewayDevice.UserInterface.RemoteAccess.Protocol"
      interval: 0
    - path: "InternetGatewayDevice.UserInterface.RemoteAccess.SupportedProtocols"
      interval: 0
    # --- MemoryStatus (TR-098 §DeviceInfo.MemoryStatus) ---
    # Total/Free in KB. Memory-usage dashboards compute
    # (Total - Free) / Total * 100 with NULLIF on the denominator to
    # survive firmware that reports Total=0.
    - path: "InternetGatewayDevice.DeviceInfo.MemoryStatus.Total"
      interval: 0
    - path: "InternetGatewayDevice.DeviceInfo.MemoryStatus.Free"
      interval: 0
    # --- ProcessStatus (TR-098 §DeviceInfo.ProcessStatus) ---
    # CPUUsage is a percentage (0-100) averaged across CPUs.
    - path: "InternetGatewayDevice.DeviceInfo.ProcessStatus.CPUUsage"
      interval: 0
    # --- TemperatureStatus (firmware-dependent; wildcard-safe if absent) ---
    # Name is operator-facing label; Value in °C; Status is Enabled/Disabled/Error.
    - path: "InternetGatewayDevice.DeviceInfo.TemperatureStatus.TemperatureSensor.{i}.Name"
      interval: 0
    - path: "InternetGatewayDevice.DeviceInfo.TemperatureStatus.TemperatureSensor.{i}.Value"
      interval: 0
    - path: "InternetGatewayDevice.DeviceInfo.TemperatureStatus.TemperatureSensor.{i}.Status"
      interval: 0
---
# Telemetry profile: TR-098 WAN link + L3 connection state.
#
# Covers three concerns:
#   1. L1 physical link state (WANCommonInterfaceConfig) — WAN access type,
#      link status, max bitrates, enable flag.
#   2. Aggregate byte/packet counters (WANCommonInterfaceConfig.Total*) —
#      total-across-all-connections, works regardless of L3 type (IP/PPP).
#   3. L3 connection state — both WANIPConnection (DHCP/static) and
#      WANPPPConnection (PPPoE/PPPoA) paths. Wildcard-safe: whichever
#      the CPE doesn't use returns zero instances, no fault.
#
# All params interval=0 (passive — one GPV per natural Inform session,
# no Connection Request scheduling).
#
# Scope: generic TR-098 baseline — match-all. Wildcard paths + standard
# InternetGatewayDevice.* schema means this is safe to ship against any
# TR-098-speaking CPE. Operators narrow scope in their fork by adding a
# deviceSelector (matchLabels / matchExpressions on manufacturer, model,
# firmwareVersion, tag:*, group_path:*, etc.).
#
# Priority 10 — operator-shipped vendor profiles (typical priority 50+)
# override on conflicting paths.
apiVersion: telemetry.herder.io/v1alpha1
kind: TelemetryProfile
metadata:
  name: tr098-wan
spec:
  priority: 10
  deviceSelector:
    matchExpressions:
      - key: "dataModel:igd"
        operator: Exists
  parameters:
    # --- WANCommonInterfaceConfig: L1 state (always present) ---
    - path: "InternetGatewayDevice.WANDevice.{i}.WANCommonInterfaceConfig.WANAccessType"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANCommonInterfaceConfig.PhysicalLinkStatus"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANCommonInterfaceConfig.EnabledForInternet"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANCommonInterfaceConfig.Layer1UpstreamMaxBitRate"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANCommonInterfaceConfig.Layer1DownstreamMaxBitRate"
      interval: 0
    # --- WANCommonInterfaceConfig: aggregate counters (covers both IP and PPP) ---
    - path: "InternetGatewayDevice.WANDevice.{i}.WANCommonInterfaceConfig.TotalBytesSent"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANCommonInterfaceConfig.TotalBytesReceived"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANCommonInterfaceConfig.TotalPacketsSent"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANCommonInterfaceConfig.TotalPacketsReceived"
      interval: 0
    # --- WANIPConnection: L3 DHCP/static (wildcard-safe if absent) ---
    - path: "InternetGatewayDevice.WANDevice.{i}.WANConnectionDevice.{i}.WANIPConnection.{i}.ConnectionStatus"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANConnectionDevice.{i}.WANIPConnection.{i}.ConnectionType"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANConnectionDevice.{i}.WANIPConnection.{i}.Uptime"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANConnectionDevice.{i}.WANIPConnection.{i}.LastConnectionError"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANConnectionDevice.{i}.WANIPConnection.{i}.AddressingType"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANConnectionDevice.{i}.WANIPConnection.{i}.ExternalIPAddress"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANConnectionDevice.{i}.WANIPConnection.{i}.SubnetMask"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANConnectionDevice.{i}.WANIPConnection.{i}.DefaultGateway"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANConnectionDevice.{i}.WANIPConnection.{i}.DNSServers"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANConnectionDevice.{i}.WANIPConnection.{i}.MACAddress"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANConnectionDevice.{i}.WANIPConnection.{i}.NATEnabled"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANConnectionDevice.{i}.WANIPConnection.{i}.Stats.EthernetBytesSent"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANConnectionDevice.{i}.WANIPConnection.{i}.Stats.EthernetBytesReceived"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANConnectionDevice.{i}.WANIPConnection.{i}.Stats.EthernetPacketsSent"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANConnectionDevice.{i}.WANIPConnection.{i}.Stats.EthernetPacketsReceived"
      interval: 0
    # --- WANPPPConnection: L3 PPPoE/PPPoA (wildcard-safe if absent) ---
    - path: "InternetGatewayDevice.WANDevice.{i}.WANConnectionDevice.{i}.WANPPPConnection.{i}.ConnectionStatus"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANConnectionDevice.{i}.WANPPPConnection.{i}.ConnectionType"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANConnectionDevice.{i}.WANPPPConnection.{i}.Uptime"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANConnectionDevice.{i}.WANPPPConnection.{i}.LastConnectionError"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANConnectionDevice.{i}.WANPPPConnection.{i}.ExternalIPAddress"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANConnectionDevice.{i}.WANPPPConnection.{i}.DNSServers"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANConnectionDevice.{i}.WANPPPConnection.{i}.MACAddress"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANConnectionDevice.{i}.WANPPPConnection.{i}.TransportType"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANConnectionDevice.{i}.WANPPPConnection.{i}.PPPoEACName"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANConnectionDevice.{i}.WANPPPConnection.{i}.PPPoEServiceName"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANConnectionDevice.{i}.WANPPPConnection.{i}.Username"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANConnectionDevice.{i}.WANPPPConnection.{i}.Stats.EthernetBytesSent"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANConnectionDevice.{i}.WANPPPConnection.{i}.Stats.EthernetBytesReceived"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANConnectionDevice.{i}.WANPPPConnection.{i}.Stats.EthernetPacketsSent"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.{i}.WANConnectionDevice.{i}.WANPPPConnection.{i}.Stats.EthernetPacketsReceived"
      interval: 0
---
# Telemetry profile: TR-098 WiFi per-SSID/radio.
#
# Covers four concerns:
#   1. Radio/SSID state — enable flag, status, SSID, BSSID, channel,
#      802.11 standard variant, beacon type.
#   2. Security/auth posture — authentication mode, encryption modes
#      (WPA + 802.11i), SSID advertisement, transmit power. Useful for
#      auditing fleet-wide security (detect open SSIDs, WEP leakage,
#      hidden-SSID deployments).
#   3. Byte counters — aggregate per-SSID BytesSent/BytesReceived.
#      Other Stats counters (Errors, Discards, Packets, Multicast, Unicast)
#      excluded as operationally low-value.
#   4. Associated clients — MAC, IP, auth state, last transmit rate.
#      Signal strength / RSSI deliberately NOT included: those paths are
#      vendor-specific X_<VENDOR>_* extensions on TR-098 CPE. Operators
#      wanting per-client signal strength layer a vendor profile on top.
#
# All params interval=0 (passive — one GPV per natural Inform session,
# no Connection Request scheduling).
#
# Scope: generic TR-098 baseline — match-all. Wildcard paths + standard
# InternetGatewayDevice.* schema means this is safe to ship against any
# TR-098-speaking CPE. Operators narrow scope in their fork by adding a
# deviceSelector (matchLabels / matchExpressions on manufacturer, model,
# firmwareVersion, tag:*, group_path:*, etc.).
#
# Priority 10 — operator-shipped vendor profiles (typical priority 50+)
# override on conflicting paths.
apiVersion: telemetry.herder.io/v1alpha1
kind: TelemetryProfile
metadata:
  name: tr098-wifi
spec:
  priority: 10
  deviceSelector:
    matchExpressions:
      - key: "dataModel:igd"
        operator: Exists
  parameters:
    # --- Radio / SSID state ---
    - path: "InternetGatewayDevice.LANDevice.{i}.WLANConfiguration.{i}.Status"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.{i}.WLANConfiguration.{i}.Enable"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.{i}.WLANConfiguration.{i}.SSID"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.{i}.WLANConfiguration.{i}.BSSID"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.{i}.WLANConfiguration.{i}.Channel"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.{i}.WLANConfiguration.{i}.Standard"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.{i}.WLANConfiguration.{i}.BeaconType"
      interval: 0
    # Channel capability and the auto-select switch: the inputs behind the
    # Spectrum capability grading and the channel planner's rollback
    # record. Static per firmware, so the cost is one GPV per session.
    - path: "InternetGatewayDevice.LANDevice.{i}.WLANConfiguration.{i}.PossibleChannels"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.{i}.WLANConfiguration.{i}.AutoChannelEnable"
      interval: 0
    # --- Security / auth posture ---
    - path: "InternetGatewayDevice.LANDevice.{i}.WLANConfiguration.{i}.BasicAuthenticationMode"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.{i}.WLANConfiguration.{i}.WPAEncryptionModes"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.{i}.WLANConfiguration.{i}.IEEE11iEncryptionModes"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.{i}.WLANConfiguration.{i}.SSIDAdvertisementEnabled"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.{i}.WLANConfiguration.{i}.TransmitPower"
      interval: 0
    # --- Byte counters ---
    - path: "InternetGatewayDevice.LANDevice.{i}.WLANConfiguration.{i}.Stats.BytesSent"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.{i}.WLANConfiguration.{i}.Stats.BytesReceived"
      interval: 0
    # The standard-position byte counters as well: the canonical byte
    # counters map to TotalBytesSent/TotalBytesReceived (TR-098 keeps bytes
    # on the object, not under Stats), so history has to hold them.
    - path: "InternetGatewayDevice.LANDevice.{i}.WLANConfiguration.{i}.TotalBytesSent"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.{i}.WLANConfiguration.{i}.TotalBytesReceived"
      interval: 0
    # --- Association counts ---
    - path: "InternetGatewayDevice.LANDevice.{i}.WLANConfiguration.{i}.TotalAssociations"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.{i}.WLANConfiguration.{i}.AssociatedDeviceNumberOfEntries"
      interval: 0
    # --- Associated clients (standard TR-098 only, no X_<VENDOR>_*) ---
    - path: "InternetGatewayDevice.LANDevice.{i}.WLANConfiguration.{i}.AssociatedDevice.{i}.AssociatedDeviceMACAddress"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.{i}.WLANConfiguration.{i}.AssociatedDevice.{i}.AssociatedDeviceIPAddress"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.{i}.WLANConfiguration.{i}.AssociatedDevice.{i}.AssociatedDeviceAuthenticationState"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.{i}.WLANConfiguration.{i}.AssociatedDevice.{i}.LastDataTransmitRate"
      interval: 0
---
# Telemetry profile: TR-098 LAN Ethernet interface.
#
# Per-port LAN Ethernet link state and aggregate byte counters.
# Error/discard/multicast/unicast/packet counters deliberately excluded —
# operationally low-value for day-1 operator dashboards.
#
# All params interval=0 (passive — one GPV per natural Inform session,
# no Connection Request scheduling).
#
# Scope: generic TR-098 baseline — match-all. Wildcard paths + standard
# InternetGatewayDevice.* schema means this is safe to ship against any
# TR-098-speaking CPE. Operators narrow scope in their fork by adding a
# deviceSelector (matchLabels / matchExpressions on manufacturer, model,
# firmwareVersion, tag:*, group_path:*, etc.).
#
# Priority 10 — operator-shipped vendor profiles (typical priority 50+)
# override on conflicting paths.
apiVersion: telemetry.herder.io/v1alpha1
kind: TelemetryProfile
metadata:
  name: tr098-lan-eth
spec:
  priority: 10
  deviceSelector:
    matchExpressions:
      - key: "dataModel:igd"
        operator: Exists
  parameters:
    - path: "InternetGatewayDevice.LANDevice.{i}.LANEthernetInterfaceConfig.{i}.Status"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.{i}.LANEthernetInterfaceConfig.{i}.MACAddress"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.{i}.LANEthernetInterfaceConfig.{i}.Stats.BytesSent"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.{i}.LANEthernetInterfaceConfig.{i}.Stats.BytesReceived"
      interval: 0
---
# Telemetry profile: TR-098 connected hosts table.
#
# Per-device table of clients currently or recently associated with the
# gateway's LAN — wired and wireless. Covers IPv4, IPv6 (both legacy
# scalar and modern instance-table forms), MAC, interface type, and
# L2 interface back-reference so dashboards can correlate hosts with
# WLAN configs or wired ports.
#
# LeaseTimeRemaining deliberately excluded — it counts down every second,
# a poor time-series fit (pure noise in the history hypertable).
#
# All params interval=0 (passive — one GPV per natural Inform session,
# no Connection Request scheduling).
#
# Scope: generic TR-098 baseline — match-all. Wildcard paths + standard
# InternetGatewayDevice.* schema means this is safe to ship against any
# TR-098-speaking CPE. Operators narrow scope in their fork by adding a
# deviceSelector (matchLabels / matchExpressions on manufacturer, model,
# firmwareVersion, tag:*, group_path:*, etc.).
#
# Priority 10 — operator-shipped vendor profiles (typical priority 50+)
# override on conflicting paths.
apiVersion: telemetry.herder.io/v1alpha1
kind: TelemetryProfile
metadata:
  name: tr098-lan-hosts
spec:
  priority: 10
  deviceSelector:
    matchExpressions:
      - key: "dataModel:igd"
        operator: Exists
  parameters:
    # --- Table cardinality ---
    - path: "InternetGatewayDevice.LANDevice.{i}.Hosts.HostNumberOfEntries"
      interval: 0
    # --- Per-host fields ---
    - path: "InternetGatewayDevice.LANDevice.{i}.Hosts.Host.{i}.Active"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.{i}.Hosts.Host.{i}.HostName"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.{i}.Hosts.Host.{i}.IPAddress"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.{i}.Hosts.Host.{i}.MACAddress"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.{i}.Hosts.Host.{i}.AddressSource"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.{i}.Hosts.Host.{i}.InterfaceType"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.{i}.Hosts.Host.{i}.Layer2Interface"
      interval: 0
    # --- IPv6: legacy scalar form (older TR-098 variants) ---
    - path: "InternetGatewayDevice.LANDevice.{i}.Hosts.Host.{i}.IPv6Address"
      interval: 0
    # --- IPv6: modern instance-table form ---
    - path: "InternetGatewayDevice.LANDevice.{i}.Hosts.Host.{i}.IPv6Address.{i}.IPAddress"
      interval: 0
