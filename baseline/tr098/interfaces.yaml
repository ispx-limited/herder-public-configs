# Canonical interface mappings for TR-098 (InternetGatewayDevice.*)
# devices.
#
# Same canonical.interface.* names as interfaces-tr181, mapped to the
# IGD tree: the WAN side lives under WANDevice and the LAN switch ports
# under LANDevice.1.LANEthernetInterfaceConfig. A profile written
# against these canonicals renders identically over either data model,
# which is the whole point of the namespace.
apiVersion: mapping.herder.io/v1alpha1
kind: MappingTable
metadata:
  name: interfaces-tr098
spec:
  mappings:
    # LAN ports, wildcarded. One declaration, however many ports the
    # device has.
    #
    # This used to enumerate lan.1 through lan.4 because four is what a
    # typical gateway has. It is not what every gateway has: the NVG
    # this was built against exposes three, an ONT exposes one or two,
    # a business gateway exposes eight or more. An enumeration invents
    # the ports a device lacks and drops the ones past the end, and
    # because an unresolved field is omitted from the device page
    # rather than shown as unknown, both failures are invisible.
    #
    # {i} normalizes to a single-segment wildcard on both sides, and
    # the resolver expands a templated entry against the device's own
    # parameters rather than against the declared set. Arity therefore
    # comes from the hardware.
    #
    # The counters are here because the device page asks every port for
    # bytes sent and received, and a field an entity does not map is
    # omitted from the detail rather than shown as unknown: without
    # them a switch port reads as a name, a MAC and a link state with
    # no traffic on it. An NVG578LX reports them under every
    # LANEthernetInterfaceConfig instance it has, so nothing was
    # missing on the device; the vocabulary had no name for it.
    - canonical: canonical.interface.lan.{i}.status
      valueType: string
      devicePath: InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.{i}.Status
    - canonical: canonical.interface.lan.{i}.enable
      valueType: boolean
      devicePath: InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.{i}.Enable
    - canonical: canonical.interface.lan.{i}.mac
      valueType: string
      devicePath: InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.{i}.MACAddress
    - canonical: canonical.interface.lan.{i}.bytes_sent
      valueType: unsignedint
      devicePath: InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.{i}.Stats.BytesSent
    - canonical: canonical.interface.lan.{i}.bytes_received
      valueType: unsignedint
      devicePath: InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.{i}.Stats.BytesReceived
    # The configured ceiling, not the negotiated rate: TR-098 spells it
    # 10, 100, 1000, 10000 or Auto, which is why the value is a string.
    # TR-098 has no standard parameter for the rate a port negotiated,
    # so canonical.interface.lan.{i}.current_bit_rate is absent here and
    # a vendor table maps it where the firmware has one.
    - canonical: canonical.interface.lan.{i}.max_bit_rate
      valueType: string
      devicePath: InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.{i}.MaxBitRate
    - canonical: canonical.interface.lan.{i}.duplex_mode
      valueType: string
      devicePath: InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.{i}.DuplexMode
    - canonical: canonical.interface.lan.{i}.packets_sent
      valueType: unsignedint
      devicePath: InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.{i}.Stats.PacketsSent
    - canonical: canonical.interface.lan.{i}.packets_received
      valueType: unsignedint
      devicePath: InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.{i}.Stats.PacketsReceived
    - canonical: canonical.interface.lan.{i}.errors_sent
      valueType: unsignedint
      devicePath: InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.{i}.Stats.ErrorsSent
    - canonical: canonical.interface.lan.{i}.errors_received
      valueType: unsignedint
      devicePath: InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.{i}.Stats.ErrorsReceived
    - canonical: canonical.interface.wan.status
      valueType: string
      devicePath: InternetGatewayDevice.WANDevice.1.WANCommonInterfaceConfig.PhysicalLinkStatus
    - canonical: canonical.interface.wan.type
      valueType: string
      devicePath: InternetGatewayDevice.WANDevice.1.WANCommonInterfaceConfig.WANAccessType
    - canonical: canonical.interface.wan.bytes_sent
      valueType: unsignedint
      devicePath: InternetGatewayDevice.WANDevice.1.WANCommonInterfaceConfig.TotalBytesSent
    - canonical: canonical.interface.wan.bytes_received
      valueType: unsignedint
      devicePath: InternetGatewayDevice.WANDevice.1.WANCommonInterfaceConfig.TotalBytesReceived
    # The WAN connection instance is found, not assumed.
    #
    # WANIPConnection.1 is the obvious guess and it is wrong on real
    # hardware: a live NVG578LX carries its IPv4 service on instance 2
    # and stuffs IPv6 into instance 500, so the address and the uptime
    # on its device page were blank while every field beside them
    # resolved. Nothing in TR-098 promises instance 1, and a gateway
    # that renumbers after a WAN reconfiguration would break the same
    # way.
    #
    # ConnectionType is the discriminator because it is the one value
    # spelled identically across the fleet: every WANIPConnection on
    # every device here reports IP_Routed, where ConnectionStatus is
    # "Connected" on some firmware and "connected" on others and an
    # exact match cannot serve both. The lowest matching instance wins,
    # which is the IPv4 service connection on the hardware that
    # numbers past 1, and fallbackIndex keeps instance 1 for anything
    # that reports no ConnectionType at all.
    - canonical: canonical.interface.wan.ip_address
      valueType: string
      instanceAlias:
        object: InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection.
        matchBy: ConnectionType
        matchValue: IP_Routed
        fallbackIndex: 1
      pathTemplate: InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection.{index}.ExternalIPAddress
    - canonical: canonical.interface.wan.uptime
      valueType: unsignedint
      instanceAlias:
        object: InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection.
        matchBy: ConnectionType
        matchValue: IP_Routed
        fallbackIndex: 1
      pathTemplate: InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection.{index}.Uptime
    # The rest of the connection, behind the same alias so the fields of
    # one read describe one connection.
    #
    # A PPPoE service lives under WANPPPConnection, which has a
    # different parameter set (no AddressingType, SubnetMask or
    # DefaultGateway) and cannot share these entries. A PPPoE TR-098
    # fleet binds these canonicals to WANPPPConnection in a table of its
    # own. TR-098 has no standard IPv6 parameter on the WAN connection,
    # so no IPv6 canonical is declared.
    - canonical: canonical.interface.wan.connection_status
      valueType: string
      instanceAlias:
        object: InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection.
        matchBy: ConnectionType
        matchValue: IP_Routed
        fallbackIndex: 1
      pathTemplate: InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection.{index}.ConnectionStatus
    # DHCP or Static.
    - canonical: canonical.interface.wan.addressing_type
      valueType: string
      instanceAlias:
        object: InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection.
        matchBy: ConnectionType
        matchValue: IP_Routed
        fallbackIndex: 1
      pathTemplate: InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection.{index}.AddressingType
    - canonical: canonical.interface.wan.subnet_mask
      valueType: string
      instanceAlias:
        object: InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection.
        matchBy: ConnectionType
        matchValue: IP_Routed
        fallbackIndex: 1
      pathTemplate: InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection.{index}.SubnetMask
    - canonical: canonical.interface.wan.default_gateway
      valueType: string
      instanceAlias:
        object: InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection.
        matchBy: ConnectionType
        matchValue: IP_Routed
        fallbackIndex: 1
      pathTemplate: InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection.{index}.DefaultGateway
    # A comma-separated list, as the CPE reports it.
    - canonical: canonical.interface.wan.dns_servers
      valueType: string
      instanceAlias:
        object: InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection.
        matchBy: ConnectionType
        matchValue: IP_Routed
        fallbackIndex: 1
      pathTemplate: InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection.{index}.DNSServers
    - canonical: canonical.interface.wan.mac
      valueType: string
      instanceAlias:
        object: InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection.
        matchBy: ConnectionType
        matchValue: IP_Routed
        fallbackIndex: 1
      pathTemplate: InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection.{index}.MACAddress
