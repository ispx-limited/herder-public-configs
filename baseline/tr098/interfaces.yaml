# Canonical interface mappings for TR-098 (InternetGatewayDevice.*)
# devices.
#
# Same canonical.interface.* names as interfaces-tr181, mapped to the
# IGD tree: the WAN side lives under WANDevice and the LAN switch ports
# under LANDevice.1.LANEthernetInterfaceConfig. A profile written
# against these canonicals renders identically over either data model,
# which is the whole point of the namespace.
apiVersion: mapping.herder.io/v1alpha1
kind: MappingTable
metadata:
  name: interfaces-tr098
spec:
  mappings:
    # LAN ports, wildcarded. One declaration, however many ports the
    # device has.
    #
    # This used to enumerate lan.1 through lan.4 because four is what a
    # typical gateway has. It is not what every gateway has: the NVG
    # this was built against exposes three, an ONT exposes one or two,
    # a business gateway exposes eight or more. An enumeration invents
    # the ports a device lacks and drops the ones past the end, and
    # because an unresolved field is omitted from the device page
    # rather than shown as unknown, both failures are invisible.
    #
    # {i} normalizes to a single-segment wildcard on both sides, and
    # the resolver expands a templated entry against the device's own
    # parameters rather than against the declared set. Arity therefore
    # comes from the hardware.
    #
    # The counters are here because the device page asks every port for
    # bytes sent and received, and a field an entity does not map is
    # omitted from the detail rather than shown as unknown: without
    # them a switch port reads as a name, a MAC and a link state with
    # no traffic on it. An NVG578LX reports them under every
    # LANEthernetInterfaceConfig instance it has, so nothing was
    # missing on the device; the vocabulary had no name for it.
    - canonical: canonical.interface.lan.{i}.status
      valueType: string
      devicePath: InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.{i}.Status
    - canonical: canonical.interface.lan.{i}.enable
      valueType: boolean
      devicePath: InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.{i}.Enable
    - canonical: canonical.interface.lan.{i}.mac
      valueType: string
      devicePath: InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.{i}.MACAddress
    - canonical: canonical.interface.lan.{i}.bytes_sent
      valueType: unsignedint
      devicePath: InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.{i}.Stats.BytesSent
    - canonical: canonical.interface.lan.{i}.bytes_received
      valueType: unsignedint
      devicePath: InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.{i}.Stats.BytesReceived
    - canonical: canonical.interface.wan.status
      valueType: string
      devicePath: InternetGatewayDevice.WANDevice.1.WANCommonInterfaceConfig.PhysicalLinkStatus
    - canonical: canonical.interface.wan.type
      valueType: string
      devicePath: InternetGatewayDevice.WANDevice.1.WANCommonInterfaceConfig.WANAccessType
    - canonical: canonical.interface.wan.bytes_sent
      valueType: unsignedint
      devicePath: InternetGatewayDevice.WANDevice.1.WANCommonInterfaceConfig.TotalBytesSent
    - canonical: canonical.interface.wan.bytes_received
      valueType: unsignedint
      devicePath: InternetGatewayDevice.WANDevice.1.WANCommonInterfaceConfig.TotalBytesReceived
    - canonical: canonical.interface.wan.ip_address
      valueType: string
      devicePath: InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection.1.ExternalIPAddress
    - canonical: canonical.interface.wan.uptime
      valueType: unsignedint
      devicePath: InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection.1.Uptime
