# Canonical voice mappings for TR-098 gateways (TR-104 under
# InternetGatewayDevice.Services). Two lines enumerated, the same
# declared-instances rule as the WiFi tables; gateways with more lines
# extend this at a higher-priority profile.
apiVersion: mapping.herder.io/v1alpha1
kind: MappingTable
metadata:
  name: voice-tr104
spec:
  mappings:
    - canonical: canonical.voice.line.1.status
      valueType: string
      devicePath: InternetGatewayDevice.Services.VoiceService.1.VoiceProfile.1.Line.1.Status
    - canonical: canonical.voice.line.1.enable
      valueType: string
      devicePath: InternetGatewayDevice.Services.VoiceService.1.VoiceProfile.1.Line.1.Enable
    - canonical: canonical.voice.line.1.number
      valueType: string
      devicePath: InternetGatewayDevice.Services.VoiceService.1.VoiceProfile.1.Line.1.DirectoryNumber
    - canonical: canonical.voice.line.1.sip.username
      valueType: string
      devicePath: InternetGatewayDevice.Services.VoiceService.1.VoiceProfile.1.Line.1.SIP.AuthUserName
    - canonical: canonical.voice.line.1.sip.password
      valueType: string
      devicePath: InternetGatewayDevice.Services.VoiceService.1.VoiceProfile.1.Line.1.SIP.AuthPassword
    - canonical: canonical.voice.line.2.status
      valueType: string
      devicePath: InternetGatewayDevice.Services.VoiceService.1.VoiceProfile.1.Line.2.Status
    - canonical: canonical.voice.line.2.enable
      valueType: string
      devicePath: InternetGatewayDevice.Services.VoiceService.1.VoiceProfile.1.Line.2.Enable
    - canonical: canonical.voice.line.2.number
      valueType: string
      devicePath: InternetGatewayDevice.Services.VoiceService.1.VoiceProfile.1.Line.2.DirectoryNumber
    - canonical: canonical.voice.line.2.sip.username
      valueType: string
      devicePath: InternetGatewayDevice.Services.VoiceService.1.VoiceProfile.1.Line.2.SIP.AuthUserName
    - canonical: canonical.voice.line.2.sip.password
      valueType: string
      devicePath: InternetGatewayDevice.Services.VoiceService.1.VoiceProfile.1.Line.2.SIP.AuthPassword
    - canonical: canonical.voice.sip.registrar
      valueType: string
      devicePath: InternetGatewayDevice.Services.VoiceService.1.VoiceProfile.1.SIP.RegistrarServer
    - canonical: canonical.voice.sip.proxy
      valueType: string
      devicePath: InternetGatewayDevice.Services.VoiceService.1.VoiceProfile.1.SIP.ProxyServer
---
# Telemetry profile: TR-098 voice lines, the TR-104 issue 1 tree.
#
# Same reasoning as tr181-voice next door: the mapping table says where
# the lines are, and nothing asks for them until a telemetry profile
# does. Every path is templated so a gateway without a VoiceService
# tree expands to nothing rather than faulting 9005 and taking the rest
# of the collection batch with it, and the SIP password is absent
# because the module declares it write-only.
apiVersion: telemetry.herder.io/v1alpha1
kind: TelemetryProfile
metadata:
  name: tr098-voice
spec:
  priority: 10
  deviceSelector:
    matchExpressions:
      - key: "dataModel:igd"
        operator: Exists
  parameters:
    - path: "InternetGatewayDevice.Services.VoiceService.{i}.VoiceProfile.{i}.Line.{i}.Status"
      interval: 0
    - path: "InternetGatewayDevice.Services.VoiceService.{i}.VoiceProfile.{i}.Line.{i}.Enable"
      interval: 0
    - path: "InternetGatewayDevice.Services.VoiceService.{i}.VoiceProfile.{i}.Line.{i}.DirectoryNumber"
      interval: 0
    - path: "InternetGatewayDevice.Services.VoiceService.{i}.VoiceProfile.{i}.Line.{i}.SIP.AuthUserName"
      interval: 0
    - path: "InternetGatewayDevice.Services.VoiceService.{i}.VoiceProfile.{i}.SIP.RegistrarServer"
      interval: 0
    - path: "InternetGatewayDevice.Services.VoiceService.{i}.VoiceProfile.{i}.SIP.ProxyServer"
      interval: 0
