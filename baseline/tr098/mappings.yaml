# Baseline fallback mapping profile for any TR-098 device.
#
# Priority 10 with a `dataModel:igd` Exists selector, so it binds to
# every device that ever reported an `InternetGatewayDevice.*` path.
# Mapping profile selection picks the LOWEST priority number (see
# backend/internal/mapping/selector/resolve.go, ascending sort, first
# wins; the opposite of telemetry, where matching profiles merge and
# the highest number wins on conflicts). A vendor profile that should
# outbind this baseline therefore ships at a priority BELOW 10, and it
# must repeat the whole baseline vocabulary it still needs, because
# binding is single-profile: a vendor profile that names only its own
# tables strips the device of canonical.mgmt.connection_request_url
# and makes it undispatchable.
#
# Why a fallback has to exist: canonical→raw resolution needs a bound
# profile, and connection-request dispatch resolves the CPE's URL through
# `canonical.mgmt.connection_request_url`. With only vendor profiles
# shipped, any CPE outside those vendor tuples resolved with
# reason=no_binding, so the ACS reported "no connection request URL" and
# could never reach the device — every task silently waited for the next
# periodic Inform instead. Operator-authored vendor profiles then look
# like the only way to make a CPE manageable at all, which is exactly
# backwards.
apiVersion: mapping.herder.io/v1alpha1
kind: MappingProfile
metadata:
  name: baseline-tr098
spec:
  priority: 10
  deviceSelector:
    matchExpressions:
      - key: "dataModel:igd"
        operator: Exists
  parameterMappings:
    - device-info-tr098
    - mgmt-tr098
    - diagnostics-tr098
    - netdiag-tr098
    - wifi-tr098
    - wifi-bssid-tr098
    - wifi-capability-tr098
    - interfaces-tr098
    - voice-tr104

---
# Canonical WiFi mappings for TR-098 (InternetGatewayDevice.*) devices.
#
# WiFi is the first canonical namespace with multi-instance objects, and it
# exposes a property of the resolver worth knowing before editing this file:
# a canonical wildcard (`canonical.wifi.ssid.*.ssid`) is expanded by walking
# the DECLARED entries in this table, not by scanning the device's stored
# parameters. An instance therefore only exists northbound if it is written
# out below. That is why the ranges are enumerated rather than expressed as
# a pattern.
#
# The ranges cover 8 WLAN configurations, because the commonest residential
# TR-098 layout splits them across the physical radios: instances 1 to 4 are
# BSSes on the 2.4 GHz radio and 5 to 8 on the 5 GHz one. A table stopping at
# 4 made every such gateway's 5 GHz half invisible, and a fleet of them read
# as 2.4 GHz-only homes on the Spectrum page. Operators serving devices with
# more extend this table on a profile of their own; nothing in Go caps the
# count.
apiVersion: mapping.herder.io/v1alpha1
kind: MappingTable
metadata:
  name: wifi-tr098
spec:
  mappings:
  # TR-098 has no separate Radio object: WLANConfiguration carries both the
  # radio settings and the SSID, so radio.{i} and ssid.{i} both map into it.
  # Consumers read the same canonical names on either data model, which is
  # the entire point of the canonical layer.
    - canonical: canonical.wifi.radio.1.enable
      valueType: boolean
      devicePath: InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.Enable
    - canonical: canonical.wifi.radio.1.status
      valueType: string
      devicePath: InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.Status
    - canonical: canonical.wifi.radio.1.channel
      valueType: unsignedint
      devicePath: InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.Channel
    - canonical: canonical.wifi.radio.1.band
      valueType: string
      devicePath: InternetGatewayDevice.LANDevice.1.WLANConfiguration.1.Standard
