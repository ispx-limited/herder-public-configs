      devicePath: InternetGatewayDevice.LANDevice.1.WLANConfiguration.3.Standard
    - canonical: canonical.wifi.radio.4.enable
      valueType: boolean
      devicePath: InternetGatewayDevice.LANDevice.1.WLANConfiguration.4.Enable
    - canonical: canonical.wifi.radio.4.status
      valueType: string
      devicePath: InternetGatewayDevice.LANDevice.1.WLANConfiguration.4.Status
    - canonical: canonical.wifi.radio.4.channel
