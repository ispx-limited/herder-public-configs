# Canonical interface mappings for TR-181 (Device.*) devices.
#
# The canonical.interface.* namespace is what the device page's ports
# view and the interface tables resolve, so a device only shows ports
# northbound if they are written out here (same declared-instances rule
# as the WiFi tables; see the note in mappings.yaml).
#
# The WAN rows find their instance rather than assuming it; the LAN
# rows below still assume the common residential layout, where the
# first ethernet interface is the uplink and the rest are switch ports.
# A vendor whose port ordering differs overrides this table at a
# higher-priority profile, which is the intended shape for all vendor
# knowledge.
apiVersion: mapping.herder.io/v1alpha1
kind: MappingTable
metadata:
  name: interfaces-tr181
spec:
  mappings:
    # The WAN is found, not assumed. TR-181 promises nothing about
    # instance numbering, and a GPON ONT in PPPoE routed mode proves it:
    # on a TP-Link XC220-G3, Device.IP.Interface.1 is the 192.168.1.1/24
    # LAN bridge and the uplink is instance 6 on one unit and 8 on the
    # next, so the device page showed the LAN bridge as a WAN with no
    # link while the PPP session was up. A static index is wrong on
    # half the fleet and a per-model override on the other half.
    #
    # The physical uplink is the ethernet interface that reports
    # Upstream true, the flag TR-181 defines for exactly this. The WAN
    # IP interface is the one whose address is a /32 host route, which
    # is what a PPP session hands out where a LAN bridge carries a /24
    # and a management VLAN a /16. Both comparisons are exact, so this
    # file loads on every release. Matching LowerLayers on the
    # Device.PPP. prefix says the same thing more directly and is the
    # intended form once every supported release understands
    # matchType: Prefix (Herder 0.9 and later). fallbackIndex 1 keeps
    # today's behaviour on gateways that report no match.
    - canonical: canonical.interface.wan.status
      valueType: string
      instanceAlias:
        object: Device.IP.Interface.
        matchBy: IPv4Address.1.SubnetMask
        matchValue: 255.255.255.255
        fallbackIndex: 1
      pathTemplate: Device.IP.Interface.{index}.Status
    - canonical: canonical.interface.wan.mac
      valueType: string
      instanceAlias:
        object: Device.Ethernet.Interface.
        matchBy: Upstream
        matchValue: "true"
        matchType: Boolean
        fallbackIndex: 1
      pathTemplate: Device.Ethernet.Interface.{index}.MACAddress
    - canonical: canonical.interface.wan.bytes_sent
      valueType: unsignedint
      instanceAlias:
        object: Device.Ethernet.Interface.
        matchBy: Upstream
        matchValue: "true"
        matchType: Boolean
        fallbackIndex: 1
      pathTemplate: Device.Ethernet.Interface.{index}.Stats.BytesSent
    - canonical: canonical.interface.wan.bytes_received
      valueType: unsignedint
      instanceAlias:
        object: Device.Ethernet.Interface.
        matchBy: Upstream
        matchValue: "true"
        matchType: Boolean
        fallbackIndex: 1
      pathTemplate: Device.Ethernet.Interface.{index}.Stats.BytesReceived
    - canonical: canonical.interface.wan.ip_address
      valueType: string
      instanceAlias:
        object: Device.IP.Interface.
        matchBy: IPv4Address.1.SubnetMask
        matchValue: 255.255.255.255
        fallbackIndex: 1
      pathTemplate: Device.IP.Interface.{index}.IPv4Address.1.IPAddress
    # LAN ports are the Ethernet interfaces whose Upstream flag is
    # false, in instance order, however many the device has and
    # wherever its uplink sits. TR-181 defines the flag for exactly this
    # split, so no layout is assumed: a gateway with its WAN first
    # resolves lan.1 to Interface.2, a mesh unit with two ports and a
    # wireless uplink at Interface.3 resolves lan.1 and lan.2 to
    # Interface.1 and 2. Boolean matching because firmware spells the
    # flag as 1/0 or true/false.
    - canonical: canonical.interface.lan.{i}.status
      valueType: string
      instanceAlias:
        object: Device.Ethernet.Interface.
        matchBy: Upstream
        matchValue: "false"
        matchType: Boolean
        select: All
      pathTemplate: Device.Ethernet.Interface.{index}.Status
    - canonical: canonical.interface.lan.{i}.enable
      valueType: boolean
      instanceAlias:
        object: Device.Ethernet.Interface.
        matchBy: Upstream
        matchValue: "false"
        matchType: Boolean
        select: All
      pathTemplate: Device.Ethernet.Interface.{index}.Enable
    - canonical: canonical.interface.lan.{i}.mac
      valueType: string
      instanceAlias:
        object: Device.Ethernet.Interface.
        matchBy: Upstream
        matchValue: "false"
        matchType: Boolean
        select: All
      pathTemplate: Device.Ethernet.Interface.{index}.MACAddress
    - canonical: canonical.interface.lan.{i}.bytes_sent
      valueType: unsignedint
      instanceAlias:
        object: Device.Ethernet.Interface.
        matchBy: Upstream
        matchValue: "false"
        matchType: Boolean
        select: All
      pathTemplate: Device.Ethernet.Interface.{index}.Stats.BytesSent
    - canonical: canonical.interface.lan.{i}.bytes_received
      valueType: unsignedint
      instanceAlias:
        object: Device.Ethernet.Interface.
        matchBy: Upstream
        matchValue: "false"
        matchType: Boolean
        select: All
      pathTemplate: Device.Ethernet.Interface.{index}.Stats.BytesReceived
