# Telemetry profile: TR-181 system identity.
#
# Collects device identity, firmware, and uptime — the minimum set
# needed for fleet identity dashboards and firmware-distribution views.
# TR-181 mirror of tr098-system.yaml.
#
# All params interval=0 (passive — one GPV per natural Inform session,
# no Connection Request scheduling).
#
# Scope: any TR-181-capable CPE (matched via dataModel:device label
# written by the CWMP handler's detectDataModels helper — see #321).
# Binds on the first qualifying Inform (one whose ParameterList
# contains at least one Device.*-rooted path) — data_models is
# persisted before session creation, so the label is available when
# the telemetry phase matches profiles in the same session.
#
# Priority 10 — operator-shipped vendor profiles (typical priority 50+)
# override on conflicting paths.
apiVersion: telemetry.herder.io/v1alpha1
kind: TelemetryProfile
metadata:
  name: tr181-system
spec:
  priority: 10
  deviceSelector:
    matchExpressions:
      - key: "dataModel:device"
        operator: Exists
  parameters:
    # Identity, and it is NOT redundant with the devices row. A CPE
    # announces itself in the Inform's DeviceID struct, which Herder
    # persists as the device record, and the device page's status form
    # reads canonical.device.* instead, which resolves through
    # device_parameters. Without these the form renders a blank
    # Manufacturer, Model, Product class and Serial number on hardware
    # that has been telling us all four every session.
    - path: "Device.DeviceInfo.Manufacturer"
      interval: 0
    - path: "Device.DeviceInfo.ManufacturerOUI"
      interval: 0
    - path: "Device.DeviceInfo.ModelName"
      interval: 0
    - path: "Device.DeviceInfo.ProductClass"
      interval: 0
    - path: "Device.DeviceInfo.SerialNumber"
      interval: 0
    - path: "Device.DeviceInfo.Description"
      interval: 0
    - path: "Device.DeviceInfo.HardwareVersion"
      interval: 0
    - path: "Device.DeviceInfo.SoftwareVersion"
      interval: 0
    - path: "Device.DeviceInfo.UpTime"
      interval: 0
    # The inform schedule the CPE is actually running, which is the one
    # number that says whether a quiet device is broken or simply on a
    # long interval. Credentials in this subtree are deliberately absent:
    # a collected password is a password in telemetry history.
    - path: "Device.ManagementServer.PeriodicInformEnable"
      interval: 0
    - path: "Device.ManagementServer.PeriodicInformInterval"
      interval: 0
    # --- MemoryStatus (TR-181 §DeviceInfo.MemoryStatus) ---
    # Total/Free in KB. Memory-usage dashboards compute
    # (Total - Free) / Total * 100 with NULLIF on the denominator to
    # survive firmware that reports Total=0.
    - path: "Device.DeviceInfo.MemoryStatus.Total"
      interval: 0
    - path: "Device.DeviceInfo.MemoryStatus.Free"
      interval: 0
    # --- ProcessStatus (TR-181 §DeviceInfo.ProcessStatus) ---
    # CPUUsage is a percentage (0-100) averaged across CPUs.
    - path: "Device.DeviceInfo.ProcessStatus.CPUUsage"
      interval: 0
    # --- TemperatureStatus (firmware-dependent; wildcard-safe if absent) ---
    # Name is operator-facing label; Value in °C; Status is Enabled/Disabled/Error.
    - path: "Device.DeviceInfo.TemperatureStatus.TemperatureSensor.{i}.Name"
      interval: 0
    - path: "Device.DeviceInfo.TemperatureStatus.TemperatureSensor.{i}.Value"
      interval: 0
    - path: "Device.DeviceInfo.TemperatureStatus.TemperatureSensor.{i}.Status"
      interval: 0
---
# Telemetry profile: TR-181 WiFi — Radio + SSID + AccessPoint bundle.
#
# TR-181 splits WiFi into 3 orthogonal objects (vs TR-098's single
# WLANConfiguration):
#
#   * Device.WiFi.Radio.*       — physical radio (channel, band,
#                                 byte counters)
#   * Device.WiFi.SSID.*        — SSID interfaces (enable, BSSID,
#                                 byte counters live HERE, not on
#                                 Radio)
#   * Device.WiFi.AccessPoint.* — AP config (security mode,
#                                 SSID advertisement, associated
#                                 clients)
#
# Device.WiFi.EndPoint.* (CPE acting as a STA in client mode) is
# deliberately excluded — rare on CPE, operator concern if needed.
#
# TR-181-vs-TR-098 schema divergences on associated clients
# (intentional, documented here so operators reading this YAML
# aren't surprised):
#
#   * MACAddress (NOT AssociatedDeviceMACAddress)
#   * AuthenticationState (NOT AssociatedDeviceAuthenticationState)
#   * LastDataDownlinkRate + LastDataUplinkRate (TR-181 splits
#     direction; TR-098 had single LastDataTransmitRate)
#   * SignalStrength IS a standard TR-181 parameter — in TR-098 it
#     was a vendor extension (X_<VENDOR>_SignalStrength). Ships in
#     the baseline because it's the single most operator-visible
#     WiFi metric.
#   * No AssociatedDevice.IPAddress — TR-181 dropped it. Dashboards
#     correlate client IP via MAC join to Device.Hosts.Host.*.
#
# Security-sensitive paths (KeyPassphrase, PreSharedKey, WEPKey,
# RadiusSecret) deliberately excluded — CPEs should return blank,
# and shipping them in the baseline is an audit-log footgun.
#
# Byte counters only (Stats.BytesSent/BytesReceived) on Radio and
# SSID — packet counters (Errors, Discards, Unicast, Multicast,
# Broadcast) excluded as operationally low-value.
#
# All params interval=0 (passive — one GPV per natural Inform session,
# no Connection Request scheduling).
#
# Scope: any TR-181-capable CPE (matched via dataModel:device label
# written by the CWMP handler's detectDataModels helper — see #321).
# Binds on the first qualifying Inform.
#
# Priority 10 — operator-shipped vendor profiles (typical priority 50+)
# override on conflicting paths.
apiVersion: telemetry.herder.io/v1alpha1
kind: TelemetryProfile
metadata:
  name: tr181-wifi
spec:
  priority: 10
  deviceSelector:
    matchExpressions:
      - key: "dataModel:device"
        operator: Exists
  parameters:
    # --- Radio state ---
    - path: "Device.WiFi.Radio.{i}.Enable"
      interval: 0
    - path: "Device.WiFi.Radio.{i}.Status"
      interval: 0
    - path: "Device.WiFi.Radio.{i}.OperatingFrequencyBand"
      interval: 0
    - path: "Device.WiFi.Radio.{i}.Channel"
      interval: 0
    - path: "Device.WiFi.Radio.{i}.OperatingStandards"
      interval: 0
    - path: "Device.WiFi.Radio.{i}.OperatingChannelBandwidth"
      interval: 0
    # --- Radio capability and the auto-select switch ---
    # The inputs behind the capability grading (band6_idle,
    # width_below_capability) and the channel planner's rollback record.
    # Without them the findings ship with nothing to read: capability is
    # graded from current parameter values, and a parameter nothing
    # collects has no current value. Static per firmware, so the cost is
    # one GPV per session.
    - path: "Device.WiFi.Radio.{i}.SupportedFrequencyBands"
      interval: 0
    - path: "Device.WiFi.Radio.{i}.PossibleChannels"
      interval: 0
    - path: "Device.WiFi.Radio.{i}.SupportedOperatingChannelBandwidths"
      interval: 0
    - path: "Device.WiFi.Radio.{i}.AutoChannelEnable"
      interval: 0
    # --- Radio byte counters ---
    - path: "Device.WiFi.Radio.{i}.Stats.BytesSent"
      interval: 0
    - path: "Device.WiFi.Radio.{i}.Stats.BytesReceived"
      interval: 0
    # --- SSID interface state + byte counters ---
    - path: "Device.WiFi.SSID.{i}.Enable"
      interval: 0
    - path: "Device.WiFi.SSID.{i}.Status"
      interval: 0
    - path: "Device.WiFi.SSID.{i}.SSID"
      interval: 0
    - path: "Device.WiFi.SSID.{i}.BSSID"
      interval: 0
    - path: "Device.WiFi.SSID.{i}.LowerLayers"
      interval: 0
    - path: "Device.WiFi.SSID.{i}.Stats.BytesSent"
      interval: 0
    - path: "Device.WiFi.SSID.{i}.Stats.BytesReceived"
      interval: 0
    # --- AccessPoint config + security mode ---
    - path: "Device.WiFi.AccessPoint.{i}.Enable"
      interval: 0
    - path: "Device.WiFi.AccessPoint.{i}.SSIDReference"
      interval: 0
    - path: "Device.WiFi.AccessPoint.{i}.SSIDAdvertisementEnabled"
      interval: 0
    - path: "Device.WiFi.AccessPoint.{i}.Security.ModeEnabled"
      interval: 0
    # Supported next to enabled: the wpa3_absent finding is the gap
    # between the two, and either alone cannot say it.
    - path: "Device.WiFi.AccessPoint.{i}.Security.ModesSupported"
      interval: 0
    - path: "Device.WiFi.AccessPoint.{i}.AssociatedDeviceNumberOfEntries"
      interval: 0
    # --- Associated clients (TR-181 spellings) ---
    - path: "Device.WiFi.AccessPoint.{i}.AssociatedDevice.{i}.MACAddress"
      interval: 0
    - path: "Device.WiFi.AccessPoint.{i}.AssociatedDevice.{i}.AuthenticationState"
      interval: 0
    - path: "Device.WiFi.AccessPoint.{i}.AssociatedDevice.{i}.LastDataDownlinkRate"
      interval: 0
    - path: "Device.WiFi.AccessPoint.{i}.AssociatedDevice.{i}.LastDataUplinkRate"
      interval: 0
    - path: "Device.WiFi.AccessPoint.{i}.AssociatedDevice.{i}.SignalStrength"
      interval: 0
    # The client's 802.11 standard, which with the signal above is the
    # whole sticky-client test.
    - path: "Device.WiFi.AccessPoint.{i}.AssociatedDevice.{i}.OperatingStandard"
      interval: 0
    - path: "Device.WiFi.AccessPoint.{i}.AssociatedDevice.{i}.Active"
      interval: 0
---
# Telemetry profile: TR-181 Ethernet interfaces.
#
# Covers both LAN and WAN Ethernet — TR-181 has no WANDevice.*
# namespace, so the WAN-vs-LAN split is carried by the per-interface
# Upstream boolean flag. Dashboards filter on Upstream=true (WAN)
# vs Upstream=false (LAN) at query time.
#
# Byte counters only (BytesSent/BytesReceived) — packet counters
# (Errors, Discards, Unicast, Multicast, Broadcast) excluded as
# operationally low-value, matching #315's tr098-lan-eth.yaml stance.
#
# All params interval=0 (passive — one GPV per natural Inform session,
# no Connection Request scheduling).
#
# Scope: any TR-181-capable CPE (matched via dataModel:device label
# written by the CWMP handler's detectDataModels helper — see #321).
# Binds on the first qualifying Inform.
#
# Priority 10 — operator-shipped vendor profiles (typical priority 50+)
# override on conflicting paths.
apiVersion: telemetry.herder.io/v1alpha1
kind: TelemetryProfile
metadata:
  name: tr181-ethernet
spec:
  priority: 10
  deviceSelector:
    matchExpressions:
      - key: "dataModel:device"
        operator: Exists
  parameters:
    - path: "Device.Ethernet.Interface.{i}.Status"
      interval: 0
    - path: "Device.Ethernet.Interface.{i}.Upstream"
      interval: 0
    - path: "Device.Ethernet.Interface.{i}.MACAddress"
      interval: 0
    - path: "Device.Ethernet.Interface.{i}.LowerLayers"
      interval: 0
    - path: "Device.Ethernet.Interface.{i}.Stats.BytesSent"
      interval: 0
    - path: "Device.Ethernet.Interface.{i}.Stats.BytesReceived"
      interval: 0
---
# Telemetry profile: TR-181 IP interfaces + IPv4/IPv6 address tables.
#
# Covers L3 IP state for both address families. No TR-098 analog —
# TR-181 distinguishes physical Ethernet (Device.Ethernet.Interface.*)
# from L3 IP (Device.IP.Interface.*), whereas TR-098 bundles L3 into
# WANIPConnection / WANPPPConnection.
#
# Type enum distinguishes Normal / Loopback / Tunnel / Tunneled
# interfaces — dashboards filter on Type=Normal for the real L3
# stack and ignore loopback / tunnel noise.
#
# IPv6Address.Origin enum (DHCPv6 / SLAAC / Static / AutoConfigured /
# etc) lets dashboards tell which IPv6 assignments are real vs
# link-local noise.
#
# All params interval=0 (passive — one GPV per natural Inform session,
# no Connection Request scheduling).
#
# Scope: any TR-181-capable CPE (matched via dataModel:device label
# written by the CWMP handler's detectDataModels helper — see #321).
# Binds on the first qualifying Inform.
#
# Priority 10 — operator-shipped vendor profiles (typical priority 50+)
# override on conflicting paths.
apiVersion: telemetry.herder.io/v1alpha1
kind: TelemetryProfile
metadata:
  name: tr181-ip
spec:
  priority: 10
  deviceSelector:
    matchExpressions:
      - key: "dataModel:device"
        operator: Exists
  parameters:
    # --- IP.Interface state ---
    - path: "Device.IP.Interface.{i}.Enable"
      interval: 0
    - path: "Device.IP.Interface.{i}.Status"
      interval: 0
    - path: "Device.IP.Interface.{i}.Type"
      interval: 0
    - path: "Device.IP.Interface.{i}.LowerLayers"
      interval: 0
    # --- IPv4 addresses ---
    - path: "Device.IP.Interface.{i}.IPv4Address.{i}.IPAddress"
      interval: 0
    - path: "Device.IP.Interface.{i}.IPv4Address.{i}.SubnetMask"
      interval: 0
    # --- IPv6 addresses ---
    - path: "Device.IP.Interface.{i}.IPv6Address.{i}.IPAddress"
      interval: 0
    - path: "Device.IP.Interface.{i}.IPv6Address.{i}.Origin"
      interval: 0
---
# Telemetry profile: TR-181 connected hosts table.
#
# Per-device table of clients currently or recently associated with
# the gateway — wired and wireless. Covers Active flag, hostname, IP,
# MAC, address source, and Layer1/Layer3 interface back-references.
#
# TR-181-vs-TR-098 schema divergences (intentional, documented here
# so operators reading this YAML aren't surprised):
#
#   * PhysAddress (NOT MACAddress) — TR-181 renamed the canonical
#     MAC field on Device.Hosts.Host.*. The legacy MACAddress is
#     absent from TR-181.
#   * Layer1Interface + Layer3Interface (NOT Layer2Interface) —
#     TR-181 split the single Layer2Interface back-reference
#     (from TR-098) into two references. Collect both so dashboards
#     can correlate hosts with WiFi radios (Layer1) AND with IP
#     interfaces (Layer3).
#
# LeaseTimeRemaining deliberately excluded — it counts down every
# second, a poor time-series fit (pure noise in the history
# hypertable). Matches #315's tr098-lan-hosts.yaml exclusion.
#
# All params interval=0 (passive — one GPV per natural Inform session,
# no Connection Request scheduling).
#
# Scope: any TR-181-capable CPE (matched via dataModel:device label
# written by the CWMP handler's detectDataModels helper — see #321).
# Binds on the first qualifying Inform.
#
# Priority 10 — operator-shipped vendor profiles (typical priority 50+)
# override on conflicting paths.
apiVersion: telemetry.herder.io/v1alpha1
kind: TelemetryProfile
metadata:
  name: tr181-hosts
spec:
  priority: 10
  deviceSelector:
    matchExpressions:
      - key: "dataModel:device"
        operator: Exists
  parameters:
    # --- Table cardinality ---
    - path: "Device.Hosts.HostNumberOfEntries"
      interval: 0
    # --- Per-host fields (TR-181 spellings) ---
    - path: "Device.Hosts.Host.{i}.Active"
      interval: 0
    - path: "Device.Hosts.Host.{i}.HostName"
      interval: 0
    - path: "Device.Hosts.Host.{i}.IPAddress"
      interval: 0
    - path: "Device.Hosts.Host.{i}.PhysAddress"
      interval: 0
    - path: "Device.Hosts.Host.{i}.AddressSource"
      interval: 0
    - path: "Device.Hosts.Host.{i}.Layer1Interface"
      interval: 0
    - path: "Device.Hosts.Host.{i}.Layer3Interface"
      interval: 0
---
apiVersion: telemetry.herder.io/v1alpha1
kind: TelemetryProfile
metadata:
  name: tr181-multiap
spec:
  priority: 10
  deviceSelector:
    matchExpressions:
      - key: "dataModel:device"
        operator: Exists
  parameters:
    - path: "Device.WiFi.MultiAP.APDevice.{i}.MACAddress"
      interval: 0
    - path: "Device.WiFi.MultiAP.APDevice.{i}.Manufacturer"
      interval: 0
    - path: "Device.WiFi.MultiAP.APDevice.{i}.ManufacturerOUI"
      interval: 0
    - path: "Device.WiFi.MultiAP.APDevice.{i}.ModelName"
      interval: 0
    - path: "Device.WiFi.MultiAP.APDevice.{i}.SerialNumber"
      interval: 0
    - path: "Device.WiFi.MultiAP.APDevice.{i}.SoftwareVersion"
      interval: 0
    # Backhaul link RSSI from this extender to its parent controller
    # (the gateway). Used by the topology enrichment script to colour
    # the gateway→extender edge by signal strength.
    - path: "Device.WiFi.MultiAP.APDevice.{i}.SignalStrength"
      interval: 0
    - path: "Device.WiFi.MultiAP.APDevice.{i}.Radio.{i}.Enable"
      interval: 0
    - path: "Device.WiFi.MultiAP.APDevice.{i}.Radio.{i}.OperatingFrequencyBand"
      interval: 0
    - path: "Device.WiFi.MultiAP.APDevice.{i}.Radio.{i}.Channel"
      interval: 0
    - path: "Device.WiFi.MultiAP.APDevice.{i}.Radio.{i}.AP.{i}.BSSID"
      interval: 0
    - path: "Device.WiFi.MultiAP.APDevice.{i}.Radio.{i}.AP.{i}.SSID"
      interval: 0
    - path: "Device.WiFi.MultiAP.APDevice.{i}.Radio.{i}.AP.{i}.AssociatedDevice.{i}.MACAddress"
      interval: 0
    - path: "Device.WiFi.MultiAP.APDevice.{i}.Radio.{i}.AP.{i}.AssociatedDevice.{i}.SignalStrength"
      interval: 0
    - path: "Device.WiFi.MultiAP.APDevice.{i}.Radio.{i}.AP.{i}.AssociatedDevice.{i}.LastDataDownlinkRate"
      interval: 0
    - path: "Device.WiFi.DataElements.Network.ID"
      interval: 0
    - path: "Device.WiFi.DataElements.Network.ControllerID"
      interval: 0
    - path: "Device.WiFi.DataElements.Network.Device.{i}.ID"
      interval: 0
    - path: "Device.WiFi.DataElements.Network.Device.{i}.Manufacturer"
      interval: 0
---
# Telemetry profile: TR-181 radio RF measurements.
#
# The time-series half of the Spectrum page. tr181-wifi above collects
# what a radio is CONFIGURED as; this collects what the air was actually
# like, which is the only thing that distinguishes a home whose channel
# looks crowded from a home whose Wi-Fi is bad.
#
# Separate from tr181-wifi so an operator can carry one without the
# other. These paths are the ones most likely to be missing on older
# firmware: ChannelUtilization and Stats.Noise are widely implemented and
# not universally, and a CPE that faults 9005 on them has that path
# negative-cached per #605 rather than re-fetched every session.
#
# Byte counters are already collected by tr181-wifi. They are not
# repeated here: overlapping paths dedupe on the priority merge, and
# listing them twice would only make the two profiles look like they
# disagree.
#
# All params interval=0 (passive, one GPV per natural Inform session).
# That is also the resolution of the resulting chart: a fleet on a
# 24-hour inform interval gets 24-hour resolution, and the Spectrum page
# reports the measured sample interval rather than drawing a smooth line
# between two points.
#
# Scope: any TR-181-capable CPE (dataModel:device). Priority 10, so an
# operator-shipped vendor profile overrides on conflicting paths.
apiVersion: telemetry.herder.io/v1alpha1
kind: TelemetryProfile
metadata:
  name: tr181-wifi-rf
spec:
  priority: 10
  deviceSelector:
    matchExpressions:
      - key: "dataModel:device"
        operator: Exists
  parameters:
    # Percentage of time the primary channel was busy, from the radio's
    # own measurement. The single most useful RF number a CPE reports.
    - path: "Device.WiFi.Radio.{i}.ChannelUtilization"
      interval: 0
    # Noise floor in dBm. Separates "busy" from "the air here is dirty",
    # which have different fixes: one is a channel change, the other is a
    # site visit.
    - path: "Device.WiFi.Radio.{i}.Stats.Noise"
      interval: 0
    # Monotonic counters, reset on reboot. Read as differences, and a
    # negative step is a reboot rather than negative traffic. No retry
    # counter here: TR-181 has no per-radio one (the 802.11 retry counters
    # live on Device.WiFi.SSID.{i}.Stats, per BSS), and the path this
    # profile used to name faulted 9005 on every spec-compliant CPE.
    - path: "Device.WiFi.Radio.{i}.Stats.FCSErrorCount"
      interval: 0
