---
# Baseline fallback mapping profile for any TR-181 device, over CWMP or
# USP. Mirror of baseline-tr098 for the `Device.*` root; see that profile
# for why a data-model-wide fallback is required rather than optional.
#
# Carries device-info only. `Device.DeviceInfo.*` is part of the data
# model on both protocols, so this is safe for every TR-181 device.
apiVersion: mapping.herder.io/v1alpha1
kind: MappingProfile
metadata:
  name: baseline-tr181
spec:
  priority: 10
  deviceSelector:
    matchExpressions:
      - key: "dataModel:device"
        operator: Exists
  parameterMappings:
    - device-info-tr181
    - firmware-tr181
    - wifi-tr181
    - interfaces-tr181
    - voice-tr104i2
    # The neighbour-scan vocabulary. Bound here as well as declared,
    # because the `wifi_scan` action resolves canonical.wifi.scan.state
    # through the DEVICE's profile: a table that is only declared is
    # visible to the fleet-wide path lookup the RF graph reads with, and
    # invisible to the per-device resolve the trigger needs.
    - wifi-scan-tr181
    - wifi-capability-tr181
    - wifi-rf-tr181
    # Ping, traceroute and DNS lookup: bound for the same reason as
    # wifi-scan-tr181 above. The actions set and await these canonicals
    # through the device's bound profile.
    - netdiag-tr181
---
# CWMP-only half of the TR-181 baseline: the `canonical.mgmt.*` table.
#
# `Device.ManagementServer.*` is the TR-069 CPE WAN Management Protocol
# object. A TR-369 agent runs the same TR-181 data model but has no
# ManagementServer at all (its controller relationship lives under
# `Device.LocalAgent.*` and its transport under `Device.MQTT.*`), so
# binding this table to a USP device produces canonicals that resolve to
# paths the agent will reject: obuspa answers err 7026
# "Path (Device.ManagementServer) does not exist in the schema".
#
# Scoping it with `protocol:cwmp` (#569) means a rule targeting
# `canonical.mgmt.*` on a USP device now fails with a clear
# canonical_unmapped instead of a confusing schema error from the agent
# — the rule is what is wrong, and the error should say so.
apiVersion: mapping.herder.io/v1alpha1
kind: MappingProfile
metadata:
  name: baseline-tr181-cwmp
spec:
  # Higher than baseline-tr181 deliberately: both match a CWMP TR-181
  # device, and at equal priority the tie-break bound the mgmt-less
  # profile, which made every canonical.mgmt.* write fail translation
  # on exactly the devices this profile exists for. Measured on the
  # demo fleet as 52k failed SetParameterValues and a cohort stuck in
  # bootstrap. More specific selector, higher priority.
  priority: 20
  deviceSelector:
    matchExpressions:
      - key: "dataModel:device"
        operator: Exists
      - key: "protocol:cwmp"
        operator: Exists
  parameterMappings:
    - device-info-tr181
    - firmware-tr181
    - mgmt-tr181
    - wifi-tr181
    - interfaces-tr181
    - voice-tr104i2
    - wifi-scan-tr181
    - wifi-capability-tr181
    - wifi-rf-tr181
    - netdiag-tr181

---
# Canonical WiFi mappings for TR-181 (Device.*) devices.
#
# WiFi is the first canonical namespace with multi-instance objects, and it
# exposes a property of the resolver worth knowing before editing this file:
# a canonical wildcard (`canonical.wifi.ssid.*.ssid`) is expanded by walking
# the DECLARED entries in this table, not by scanning the device's stored
# parameters. An instance therefore only exists northbound if it is written
# out below. That is why the ranges are enumerated rather than expressed as
# a pattern.
#
# The ranges cover what residential gateways actually expose: 2 radios, 4 SSIDs, 4 access points.
# Operators serving devices with more radios or SSIDs extend this table at a
# higher-priority profile; nothing in Go caps the count.
apiVersion: mapping.herder.io/v1alpha1
kind: MappingTable
metadata:
  name: wifi-tr181
spec:
  mappings:
    - canonical: canonical.wifi.radio.1.enable
      valueType: boolean
      devicePath: Device.WiFi.Radio.1.Enable
    - canonical: canonical.wifi.radio.1.status
      valueType: string
      devicePath: Device.WiFi.Radio.1.Status
    - canonical: canonical.wifi.radio.1.channel
      valueType: unsignedint
      devicePath: Device.WiFi.Radio.1.Channel
    - canonical: canonical.wifi.radio.1.band
      valueType: string
      devicePath: Device.WiFi.Radio.1.OperatingFrequencyBand
    - canonical: canonical.wifi.radio.2.enable
      valueType: boolean
      devicePath: Device.WiFi.Radio.2.Enable
    - canonical: canonical.wifi.radio.2.status
      valueType: string
      devicePath: Device.WiFi.Radio.2.Status
    - canonical: canonical.wifi.radio.2.channel
      valueType: unsignedint
      devicePath: Device.WiFi.Radio.2.Channel
    - canonical: canonical.wifi.radio.2.band
      valueType: string
      devicePath: Device.WiFi.Radio.2.OperatingFrequencyBand
    # A third radio, because 6 GHz is normally Radio.3 on a tri-band
    # gateway and a band the platform cannot see is a band it will report
    # as absent.
    - canonical: canonical.wifi.radio.3.enable
      valueType: boolean
      devicePath: Device.WiFi.Radio.3.Enable
    - canonical: canonical.wifi.radio.3.status
      valueType: string
      devicePath: Device.WiFi.Radio.3.Status
    - canonical: canonical.wifi.radio.3.channel
      valueType: unsignedint
      devicePath: Device.WiFi.Radio.3.Channel
    - canonical: canonical.wifi.radio.3.band
      valueType: string
      devicePath: Device.WiFi.Radio.3.OperatingFrequencyBand
    # The auto-channel switch, one per radio. The channel planner writes
    # it: a channel set against a radio still running auto-select is a
    # set the CPE's own algorithm is free to revert, so a plan apply
    # disables the switch in the same SetParameterValues and a rollback
    # restores what the CPE reported before.
    - canonical: canonical.wifi.radio.1.auto_channel_enable
      valueType: boolean
      devicePath: Device.WiFi.Radio.1.AutoChannelEnable
    - canonical: canonical.wifi.radio.2.auto_channel_enable
      valueType: boolean
      devicePath: Device.WiFi.Radio.2.AutoChannelEnable
    - canonical: canonical.wifi.radio.3.auto_channel_enable
      valueType: boolean
      devicePath: Device.WiFi.Radio.3.AutoChannelEnable
    # The operating width. Without it every radio in a TR-181 fleet is
    # drawn at the assumed 20 MHz and reported as a coverage gap, and no
    # radio can be told apart from one running below what it supports.
    - canonical: canonical.wifi.radio.1.bandwidth
      valueType: string
      devicePath: Device.WiFi.Radio.1.OperatingChannelBandwidth
    - canonical: canonical.wifi.radio.2.bandwidth
      valueType: string
      devicePath: Device.WiFi.Radio.2.OperatingChannelBandwidth
    - canonical: canonical.wifi.radio.3.bandwidth
      valueType: string
      devicePath: Device.WiFi.Radio.3.OperatingChannelBandwidth
    - canonical: canonical.wifi.ssid.1.enable
      valueType: boolean
      devicePath: Device.WiFi.SSID.1.Enable
    - canonical: canonical.wifi.ssid.1.status
      valueType: string
      devicePath: Device.WiFi.SSID.1.Status
    - canonical: canonical.wifi.ssid.1.ssid
      valueType: string
      devicePath: Device.WiFi.SSID.1.SSID
    - canonical: canonical.wifi.ssid.1.bssid
      valueType: string
      devicePath: Device.WiFi.SSID.1.BSSID
    - canonical: canonical.wifi.ssid.2.enable
      valueType: boolean
      devicePath: Device.WiFi.SSID.2.Enable
    - canonical: canonical.wifi.ssid.2.status
      valueType: string
      devicePath: Device.WiFi.SSID.2.Status
    - canonical: canonical.wifi.ssid.2.ssid
      valueType: string
      devicePath: Device.WiFi.SSID.2.SSID
    - canonical: canonical.wifi.ssid.2.bssid
      valueType: string
      devicePath: Device.WiFi.SSID.2.BSSID
    - canonical: canonical.wifi.ssid.3.enable
      valueType: boolean
      devicePath: Device.WiFi.SSID.3.Enable
    - canonical: canonical.wifi.ssid.3.status
      valueType: string
      devicePath: Device.WiFi.SSID.3.Status
    - canonical: canonical.wifi.ssid.3.ssid
      valueType: string
      devicePath: Device.WiFi.SSID.3.SSID
    - canonical: canonical.wifi.ssid.3.bssid
      valueType: string
      devicePath: Device.WiFi.SSID.3.BSSID
    - canonical: canonical.wifi.ssid.4.enable
      valueType: boolean
      devicePath: Device.WiFi.SSID.4.Enable
    - canonical: canonical.wifi.ssid.4.status
      valueType: string
      devicePath: Device.WiFi.SSID.4.Status
    - canonical: canonical.wifi.ssid.4.ssid
      valueType: string
      devicePath: Device.WiFi.SSID.4.SSID
    - canonical: canonical.wifi.ssid.4.bssid
      valueType: string
      devicePath: Device.WiFi.SSID.4.BSSID
    - canonical: canonical.wifi.ap.1.enable
      valueType: boolean
      devicePath: Device.WiFi.AccessPoint.1.Enable
    - canonical: canonical.wifi.ap.1.security_mode
      valueType: string
      devicePath: Device.WiFi.AccessPoint.1.Security.ModeEnabled
    - canonical: canonical.wifi.ap.1.client_count
      valueType: unsignedint
      devicePath: Device.WiFi.AccessPoint.1.AssociatedDeviceNumberOfEntries
    - canonical: canonical.wifi.ap.2.enable
      valueType: boolean
      devicePath: Device.WiFi.AccessPoint.2.Enable
    - canonical: canonical.wifi.ap.2.security_mode
      valueType: string
      devicePath: Device.WiFi.AccessPoint.2.Security.ModeEnabled
    - canonical: canonical.wifi.ap.2.client_count
      valueType: unsignedint
      devicePath: Device.WiFi.AccessPoint.2.AssociatedDeviceNumberOfEntries
    - canonical: canonical.wifi.ap.3.enable
      valueType: boolean
      devicePath: Device.WiFi.AccessPoint.3.Enable
    - canonical: canonical.wifi.ap.3.security_mode
      valueType: string
      devicePath: Device.WiFi.AccessPoint.3.Security.ModeEnabled
    - canonical: canonical.wifi.ap.3.client_count
      valueType: unsignedint
      devicePath: Device.WiFi.AccessPoint.3.AssociatedDeviceNumberOfEntries
    - canonical: canonical.wifi.ap.4.enable
      valueType: boolean
      devicePath: Device.WiFi.AccessPoint.4.Enable
    - canonical: canonical.wifi.ap.4.security_mode
      valueType: string
      devicePath: Device.WiFi.AccessPoint.4.Security.ModeEnabled
    - canonical: canonical.wifi.ap.4.client_count
      valueType: unsignedint
      devicePath: Device.WiFi.AccessPoint.4.AssociatedDeviceNumberOfEntries
---
# Firmware, TR-181.
#
# canonical.firmware.download is the command a USP firmware campaign
# invokes. USP has no Download message: fetching and applying an image
# is a command on the data model, so the campaign asks the device's
# mapping profile where that command lives rather than assuming a path.
#
# Instance 1 because TR-181 numbers firmware images from one, and a
# single-bank agent has only that. A dual-bank device exposes two and
# has a policy about which to overwrite; an operator running those
# copies this table, narrows the profile's selector and points the
# canonical name at the slot they want. That choice is theirs, which is
# exactly why the command is a mapping and not a constant in the engine.
#
# The remaining entries are the image's own state. They are what tells
# an operator whether a campaign that reported success actually left the
# fleet running the new build, which the campaign itself cannot know: a
# CPE reporting a completed transfer has taken the file, not necessarily
# applied it.
apiVersion: mapping.herder.io/v1alpha1
kind: MappingTable
metadata:
  name: firmware-tr181
spec:
  mappings:
    - canonical: canonical.firmware.download
      valueType: string
      devicePath: Device.DeviceInfo.FirmwareImage.1.Download()
    - canonical: canonical.firmware.image.name
      valueType: string
      devicePath: Device.DeviceInfo.FirmwareImage.1.Name
    - canonical: canonical.firmware.image.version
      valueType: string
      devicePath: Device.DeviceInfo.FirmwareImage.1.Version
    - canonical: canonical.firmware.image.status
      valueType: string
      devicePath: Device.DeviceInfo.FirmwareImage.1.Status
    - canonical: canonical.firmware.image.available
      valueType: boolean
      devicePath: Device.DeviceInfo.FirmwareImage.1.Available

---
# Radio, access point and client CAPABILITY for TR-181 (Device.*) devices.
#
# The rest of the WiFi tables map what a CPE is DOING. This one maps what
# it says it CAN do, which is what the Spectrum page's band and capability
# posture compares the operating values against: a 6 GHz radio that is
# off, a width below what the radio supports, WPA3 available and not
# enabled, a client on 2.4 GHz whose 802.11 standard implies it has a
# 5 GHz radio.
#
# INSTANCE RANGES ARE A DECLARATION, NOT A LIMIT.
#
# A canonical wildcard is expanded by walking the entries in this table,
# not by scanning the device, so an instance only exists northbound if it
# is written out here. The ranges below cover what residential gateways
# expose: 3 radios (2.4, 5 and 6 GHz), 4 access points, 8 associated
# clients per access point. Operators serving devices with more extend
# this table at a higher-priority profile; nothing in Go caps the count,
# and the Spectrum page reports clients beyond the mapped range as
# coverage rather than counting them as absent.
#
# The client range is the one worth thinking about before changing it.
# Every mapped instance is a raw path in the fleet-wide path lookup, which
# is capped at 500 results, so a range of 64 clients per access point
# would crowd out the rest of the vocabulary and under-count the page in a
# way only the `truncated` coverage flag would reveal.
apiVersion: mapping.herder.io/v1alpha1
kind: MappingTable
metadata:
  name: wifi-capability-tr181
spec:
  mappings:
    # Radio capability, against the operating values in wifi-tr181.
    - canonical: canonical.wifi.radio.1.supported_bands
      valueType: string
      devicePath: Device.WiFi.Radio.1.SupportedFrequencyBands
    - canonical: canonical.wifi.radio.1.possible_channels
      valueType: string
      devicePath: Device.WiFi.Radio.1.PossibleChannels
    - canonical: canonical.wifi.radio.1.supported_standards
      valueType: string
      devicePath: Device.WiFi.Radio.1.SupportedStandards
    - canonical: canonical.wifi.radio.1.operating_standards
      valueType: string
      devicePath: Device.WiFi.Radio.1.OperatingStandards
    - canonical: canonical.wifi.radio.1.supported_bandwidths
      valueType: string
      devicePath: Device.WiFi.Radio.1.SupportedOperatingChannelBandwidths
    - canonical: canonical.wifi.radio.2.supported_bands
      valueType: string
      devicePath: Device.WiFi.Radio.2.SupportedFrequencyBands
    - canonical: canonical.wifi.radio.2.possible_channels
      valueType: string
      devicePath: Device.WiFi.Radio.2.PossibleChannels
    - canonical: canonical.wifi.radio.2.supported_standards
      valueType: string
      devicePath: Device.WiFi.Radio.2.SupportedStandards
    - canonical: canonical.wifi.radio.2.operating_standards
      valueType: string
      devicePath: Device.WiFi.Radio.2.OperatingStandards
    - canonical: canonical.wifi.radio.2.supported_bandwidths
      valueType: string
      devicePath: Device.WiFi.Radio.2.SupportedOperatingChannelBandwidths
    - canonical: canonical.wifi.radio.3.supported_bands
      valueType: string
      devicePath: Device.WiFi.Radio.3.SupportedFrequencyBands
    - canonical: canonical.wifi.radio.3.possible_channels
      valueType: string
      devicePath: Device.WiFi.Radio.3.PossibleChannels
    - canonical: canonical.wifi.radio.3.supported_standards
      valueType: string
      devicePath: Device.WiFi.Radio.3.SupportedStandards
    - canonical: canonical.wifi.radio.3.operating_standards
      valueType: string
      devicePath: Device.WiFi.Radio.3.OperatingStandards
    - canonical: canonical.wifi.radio.3.supported_bandwidths
      valueType: string
      devicePath: Device.WiFi.Radio.3.SupportedOperatingChannelBandwidths
    # Security, supported against enabled. `security_mode` itself is in
    # wifi-tr181; without the supported list next to it, an access point
    # running WPA2 cannot be told apart from one that can do nothing else.
    - canonical: canonical.wifi.ap.1.security_modes_supported
      valueType: string
      devicePath: Device.WiFi.AccessPoint.1.Security.ModesSupported
    - canonical: canonical.wifi.ap.2.security_modes_supported
      valueType: string
      devicePath: Device.WiFi.AccessPoint.2.Security.ModesSupported
    - canonical: canonical.wifi.ap.3.security_modes_supported
      valueType: string
      devicePath: Device.WiFi.AccessPoint.3.Security.ModesSupported
    - canonical: canonical.wifi.ap.4.security_modes_supported
      valueType: string
      devicePath: Device.WiFi.AccessPoint.4.Security.ModesSupported
    # The reference chain that says which radio an access point is on.
    # TR-181 splits radio, SSID and access point into three objects, so a
    # client's band is only knowable by following AccessPoint.SSIDReference
    # to an SSID and that SSID's LowerLayers to a radio. Both are followed
    # by VALUE: the mapper says which parameter holds the reference, and
    # the CPE says what it points at.
    - canonical: canonical.wifi.ap.1.ssid_ref
      valueType: string
      devicePath: Device.WiFi.AccessPoint.1.SSIDReference
    - canonical: canonical.wifi.ap.2.ssid_ref
      valueType: string
      devicePath: Device.WiFi.AccessPoint.2.SSIDReference
    - canonical: canonical.wifi.ap.3.ssid_ref
      valueType: string
      devicePath: Device.WiFi.AccessPoint.3.SSIDReference
    - canonical: canonical.wifi.ap.4.ssid_ref
      valueType: string
      devicePath: Device.WiFi.AccessPoint.4.SSIDReference
    - canonical: canonical.wifi.ssid.1.lower_layers
      valueType: string
      devicePath: Device.WiFi.SSID.1.LowerLayers
    - canonical: canonical.wifi.ssid.2.lower_layers
      valueType: string
      devicePath: Device.WiFi.SSID.2.LowerLayers
    - canonical: canonical.wifi.ssid.3.lower_layers
      valueType: string
      devicePath: Device.WiFi.SSID.3.LowerLayers
    - canonical: canonical.wifi.ssid.4.lower_layers
      valueType: string
      devicePath: Device.WiFi.SSID.4.LowerLayers
    # Per-client capability. OperatingStandard is the standard the client
    # is using on the band it is currently on, which is why the sticky
    # finding infers 5 GHz support from it rather than reading it; see
    # `implies_5ghz` in api/app/services/spectrum_capability.py for the
    # assumption and its failure case.
    - canonical: canonical.wifi.ap.1.client.1.operating_standard
      valueType: string
      devicePath: Device.WiFi.AccessPoint.1.AssociatedDevice.1.OperatingStandard
    - canonical: canonical.wifi.ap.1.client.1.signal_strength
      valueType: int
      devicePath: Device.WiFi.AccessPoint.1.AssociatedDevice.1.SignalStrength
    - canonical: canonical.wifi.ap.1.client.2.operating_standard
      valueType: string
      devicePath: Device.WiFi.AccessPoint.1.AssociatedDevice.2.OperatingStandard
    - canonical: canonical.wifi.ap.1.client.2.signal_strength
      valueType: int
      devicePath: Device.WiFi.AccessPoint.1.AssociatedDevice.2.SignalStrength
    - canonical: canonical.wifi.ap.1.client.3.operating_standard
      valueType: string
      devicePath: Device.WiFi.AccessPoint.1.AssociatedDevice.3.OperatingStandard
    - canonical: canonical.wifi.ap.1.client.3.signal_strength
      valueType: int
      devicePath: Device.WiFi.AccessPoint.1.AssociatedDevice.3.SignalStrength
    - canonical: canonical.wifi.ap.1.client.4.operating_standard
      valueType: string
      devicePath: Device.WiFi.AccessPoint.1.AssociatedDevice.4.OperatingStandard
    - canonical: canonical.wifi.ap.1.client.4.signal_strength
      valueType: int
      devicePath: Device.WiFi.AccessPoint.1.AssociatedDevice.4.SignalStrength
    - canonical: canonical.wifi.ap.1.client.5.operating_standard
      valueType: string
      devicePath: Device.WiFi.AccessPoint.1.AssociatedDevice.5.OperatingStandard
    - canonical: canonical.wifi.ap.1.client.5.signal_strength
      valueType: int
      devicePath: Device.WiFi.AccessPoint.1.AssociatedDevice.5.SignalStrength
    - canonical: canonical.wifi.ap.1.client.6.operating_standard
      valueType: string
      devicePath: Device.WiFi.AccessPoint.1.AssociatedDevice.6.OperatingStandard
    - canonical: canonical.wifi.ap.1.client.6.signal_strength
      valueType: int
      devicePath: Device.WiFi.AccessPoint.1.AssociatedDevice.6.SignalStrength
    - canonical: canonical.wifi.ap.1.client.7.operating_standard
      valueType: string
      devicePath: Device.WiFi.AccessPoint.1.AssociatedDevice.7.OperatingStandard
    - canonical: canonical.wifi.ap.1.client.7.signal_strength
      valueType: int
      devicePath: Device.WiFi.AccessPoint.1.AssociatedDevice.7.SignalStrength
    - canonical: canonical.wifi.ap.1.client.8.operating_standard
      valueType: string
      devicePath: Device.WiFi.AccessPoint.1.AssociatedDevice.8.OperatingStandard
    - canonical: canonical.wifi.ap.1.client.8.signal_strength
      valueType: int
      devicePath: Device.WiFi.AccessPoint.1.AssociatedDevice.8.SignalStrength
    - canonical: canonical.wifi.ap.2.client.1.operating_standard
      valueType: string
      devicePath: Device.WiFi.AccessPoint.2.AssociatedDevice.1.OperatingStandard
    - canonical: canonical.wifi.ap.2.client.1.signal_strength
      valueType: int
      devicePath: Device.WiFi.AccessPoint.2.AssociatedDevice.1.SignalStrength
    - canonical: canonical.wifi.ap.2.client.2.operating_standard
      valueType: string
      devicePath: Device.WiFi.AccessPoint.2.AssociatedDevice.2.OperatingStandard
    - canonical: canonical.wifi.ap.2.client.2.signal_strength
      valueType: int
      devicePath: Device.WiFi.AccessPoint.2.AssociatedDevice.2.SignalStrength
    - canonical: canonical.wifi.ap.2.client.3.operating_standard
      valueType: string
      devicePath: Device.WiFi.AccessPoint.2.AssociatedDevice.3.OperatingStandard
    - canonical: canonical.wifi.ap.2.client.3.signal_strength
      valueType: int
      devicePath: Device.WiFi.AccessPoint.2.AssociatedDevice.3.SignalStrength
    - canonical: canonical.wifi.ap.2.client.4.operating_standard
      valueType: string
      devicePath: Device.WiFi.AccessPoint.2.AssociatedDevice.4.OperatingStandard
    - canonical: canonical.wifi.ap.2.client.4.signal_strength
      valueType: int
      devicePath: Device.WiFi.AccessPoint.2.AssociatedDevice.4.SignalStrength
    - canonical: canonical.wifi.ap.2.client.5.operating_standard
