# Baseline device UI profile for TR-181 (Device.*) devices: which
# sections the device detail page shows and what each renders.
#
# Everything here is addressed by canonical name, so the profile works
# on any device whose bound mapping profile resolves the
# canonical.interface.* and canonical.wifi.* namespaces. A vendor whose
# hardware differs (more ports, an LTE modem, extra service state)
# ships a higher-priority profile with its own sections; the frontend
# renders whatever wins.
apiVersion: deviceprofiles.herder.io/v1alpha1
kind: DeviceProfile
metadata:
  name: baseline-tr181-ui
spec:
  priority: 10
  deviceSelector:
    matchExpressions:
      - key: "dataModel:device"
        operator: Exists
  sections:
    - key: overview
      title: Overview
      icon: gauge
      component: overview
    - key: status
      title: Device status
      icon: info
      component: form
      config:
        groups:
          - title: Identity
            fields:
              - {label: Manufacturer, canonical: canonical.device.manufacturer}
              - {label: Model, canonical: canonical.device.model_name}
              - {label: Product class, canonical: canonical.device.product_class}
              - {label: Serial number, canonical: canonical.device.serial_number}
              - {label: Hardware version, canonical: canonical.device.hardware_version}
              - {label: Firmware, canonical: canonical.device.software_version}
              - {label: Uptime, canonical: canonical.device.uptime, format: duration}
          - title: WAN
            fields:
              - {label: Link status, canonical: canonical.interface.wan.status}
              - {label: WAN IP address, canonical: canonical.interface.wan.ip_address}
              - {label: WAN MAC, canonical: canonical.interface.wan.mac}
          - title: Management
            fields:
              - {label: Connection request URL, canonical: canonical.mgmt.connection_request_url}
              - {label: Inform interval, canonical: canonical.mgmt.periodic_inform_interval, format: seconds}
    - key: interfaces
      title: Interfaces
      icon: ethernet-port
      component: ports
      config:
        ports:
          - {id: wan, label: WAN, kind: wan, entity: canonical.interface.wan}
          - {id: lan1, label: "1", kind: ethernet, entity: canonical.interface.lan.1}
          - {id: lan2, label: "2", kind: ethernet, entity: canonical.interface.lan.2}
          - {id: lan3, label: "3", kind: ethernet, entity: canonical.interface.lan.3}
          - {id: lan4, label: "4", kind: ethernet, entity: canonical.interface.lan.4}
          - {id: wifi24, label: 2.4 GHz, kind: wifi, entity: canonical.wifi.radio.1}
          - {id: wifi5, label: 5 GHz, kind: wifi, entity: canonical.wifi.radio.2}
    # The radios and the air they run in, on one page: a channel is only
    # a good choice against what else is on it, and the neighbour scan is
    # the only thing that says what else is there.
    - key: wifi
      title: WiFi
      icon: wifi
      component: stack
      config:
        sections:
          - key: wifi-neighbours
            title: RF neighbours
            component: neighbours
          - key: wifi-radios
            title: WiFi
            component: module
            config:
              module: wifi
    - key: network-map
      title: Network map
      icon: network
      component: topology
    - key: monitoring
      title: Monitoring
      icon: chart-line
      component: dashboard
      config:
        dashboard: tr181-traffic
    - key: actions
      title: Actions
      icon: zap
      component: actions
    - key: action-log
      title: Action log
      icon: history
      component: tasks
    - key: events
      title: Events
      icon: scroll-text
      component: events
    - key: maintenance
      title: Maintenance
      icon: wrench
      component: maintenance
