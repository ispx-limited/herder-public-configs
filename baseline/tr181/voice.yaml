# Canonical voice mappings for TR-181 gateways (TR-104 issue 2 under
# Device.Services). Same canonical names as voice-tr104, so the voice
# module renders identically over either data model: lines live under
# CallControl, SIP credentials under SIP.Client, servers under
# SIP.Network.
apiVersion: mapping.herder.io/v1alpha1
kind: MappingTable
metadata:
  name: voice-tr104i2
spec:
  mappings:
    - canonical: canonical.voice.line.1.status
      valueType: string
      devicePath: Device.Services.VoiceService.1.CallControl.Line.1.Status
    - canonical: canonical.voice.line.1.enable
      valueType: boolean
      devicePath: Device.Services.VoiceService.1.CallControl.Line.1.Enable
    - canonical: canonical.voice.line.1.number
      valueType: string
      devicePath: Device.Services.VoiceService.1.CallControl.Line.1.DirectoryNumber
    - canonical: canonical.voice.line.1.sip.username
      valueType: string
      devicePath: Device.Services.VoiceService.1.SIP.Client.1.AuthUserName
    - canonical: canonical.voice.line.1.sip.password
      valueType: string
      devicePath: Device.Services.VoiceService.1.SIP.Client.1.AuthPassword
    - canonical: canonical.voice.line.2.status
      valueType: string
      devicePath: Device.Services.VoiceService.1.CallControl.Line.2.Status
    - canonical: canonical.voice.line.2.enable
      valueType: boolean
      devicePath: Device.Services.VoiceService.1.CallControl.Line.2.Enable
    - canonical: canonical.voice.line.2.number
      valueType: string
      devicePath: Device.Services.VoiceService.1.CallControl.Line.2.DirectoryNumber
    - canonical: canonical.voice.line.2.sip.username
      valueType: string
      devicePath: Device.Services.VoiceService.1.SIP.Client.2.AuthUserName
    - canonical: canonical.voice.line.2.sip.password
      valueType: string
      devicePath: Device.Services.VoiceService.1.SIP.Client.2.AuthPassword
    - canonical: canonical.voice.sip.registrar
      valueType: string
      devicePath: Device.Services.VoiceService.1.SIP.Network.1.RegistrarServer
    - canonical: canonical.voice.sip.proxy
      valueType: string
      devicePath: Device.Services.VoiceService.1.SIP.Network.1.ProxyServer
---
# Telemetry profile: TR-181 voice lines.
#
# The mapping table above is only half a working voice surface. It says
# where the lines live; something has to ask the CPE for them. Without
# this profile the canonicals resolve to raw paths the device has never
# reported, the module renders nothing, and the device page's Voice
# section is indistinguishable from a fleet that has no voice at all.
#
# EVERY PATH IS TEMPLATED, DELIBERATELY.
#
# This profile's selector is every TR-181 CPE, and most of them have no
# VoiceService tree. A literal path on a device that lacks it faults
# 9005 for the whole GetParameterValues, taking the rest of the batch
# with it. A templated path expands against the instances the device
# actually reports, so a gateway without voice expands to nothing and
# is never asked. That is why there is no VoiceServiceNumberOfEntries
# here even though it would be the obvious thing to collect.
#
# The SIP password is absent and must stay absent. The service module
# declares it write-only for a reason: a credential that is collected
# is a credential in telemetry history.
apiVersion: telemetry.herder.io/v1alpha1
kind: TelemetryProfile
metadata:
  name: tr181-voice
spec:
  priority: 10
  deviceSelector:
    matchExpressions:
      - key: "dataModel:device"
        operator: Exists
  parameters:
    - path: "Device.Services.VoiceService.{i}.CallControl.Line.{i}.Status"
      interval: 0
    - path: "Device.Services.VoiceService.{i}.CallControl.Line.{i}.Enable"
      interval: 0
    - path: "Device.Services.VoiceService.{i}.CallControl.Line.{i}.DirectoryNumber"
      interval: 0
    - path: "Device.Services.VoiceService.{i}.SIP.Client.{i}.AuthUserName"
      interval: 0
    - path: "Device.Services.VoiceService.{i}.SIP.Network.{i}.RegistrarServer"
      interval: 0
    - path: "Device.Services.VoiceService.{i}.SIP.Network.{i}.ProxyServer"
      interval: 0
