# Telemetry profile: Wi-Fi Alliance Data Elements RF measurements.
#
# The collection half of the dataelements-wifi-rf mapping profile. A
# mapping profile says where a canonical lives; nothing fetches it until
# a telemetry profile asks for it, and the Spectrum page's time axis is
# built from history rather than from current state.
#
# Wildcards rather than enumerated instances, unlike the mapping table
# next to it: telemetry patterns are resolved against the device's actual
# tree with one GPN per instance dimension, so `{i}` collects however
# many radios and BSSs a CPE really has. The mapping table has to
# enumerate because canonical wildcards expand over declared entries; the
# two mechanisms are different and the difference is deliberate.
#
# Scope: any TR-181-capable CPE. A CPE with no Data Elements tree faults
# 9005 on the first attempt and the paths are negative-cached per #605,
# so the cost of shipping this on by default is one wasted GPV per device
# per firmware version.
#
# All params interval=0 (passive, one GPV per natural Inform session).
apiVersion: telemetry.herder.io/v1alpha1
kind: TelemetryProfile
metadata:
  name: dataelements-wifi-rf
spec:
  priority: 10
  deviceSelector:
    matchExpressions:
      - key: "dataModel:device"
        operator: Exists
  parameters:
    # Which AP in the mesh each Device.{i} is, so a reader can tell the
    # gateway from its extenders. ControllerID names the gateway.
    - path: "Device.WiFi.DataElements.Network.ControllerID"
      interval: 3600
    - path: "Device.WiFi.DataElements.Network.Device.{i}.ID"
      interval: 3600
    # --- Radio identity and operating state ---
    - path: "Device.WiFi.DataElements.Network.Device.{i}.Radio.{i}.ID"
      interval: 3600
    # The operating class every contact, not hourly: it is the only
    # standard leaf that names a Data Elements radio's band (81 to 84 are
    # 2.4 GHz, 115 to 130 are 5 GHz, 131 to 137 are 6 GHz), and the
    # client labels rule reads it from the same batch as the stations.
    # Fetched hourly it is absent from all but one batch in twelve, and
    # every client on an extender would be skipped for want of a band.
    - path: "Device.WiFi.DataElements.Network.Device.{i}.Radio.{i}.CurrentOperatingClasses.{i}.Class"
      interval: 0
    - path: "Device.WiFi.DataElements.Network.Device.{i}.Radio.{i}.CurrentOperatingClasses.{i}.Channel"
      interval: 900
    # --- The RF measurement itself ---
    # Utilization is the total; Transmit, ReceiveSelf and ReceiveOther
    # decompose it into this radio's own activity and everyone else's.
    # Collecting Utilization without the other three gives a busyness
    # chart with no explanation, which is the state TR-181 proper leaves
    # an operator in.
    - path: "Device.WiFi.DataElements.Network.Device.{i}.Radio.{i}.Utilization"
      interval: 0
    - path: "Device.WiFi.DataElements.Network.Device.{i}.Radio.{i}.Transmit"
      interval: 0
    - path: "Device.WiFi.DataElements.Network.Device.{i}.Radio.{i}.ReceiveSelf"
      interval: 0
    - path: "Device.WiFi.DataElements.Network.Device.{i}.Radio.{i}.ReceiveOther"
      interval: 0
    # Noise floor, ANPI-encoded (dBm + 110). The mapping table carries
    # the conversion.
    - path: "Device.WiFi.DataElements.Network.Device.{i}.Radio.{i}.Noise"
      interval: 0
    # --- Per-BSS identity and counters ---
    # BSSID is what a later spec resolves neighbour scans against; the
    # counters are what separates a busy channel the home is causing from
    # one it is not.
    - path: "Device.WiFi.DataElements.Network.Device.{i}.Radio.{i}.BSS.{i}.BSSID"
      interval: 3600
    - path: "Device.WiFi.DataElements.Network.Device.{i}.Radio.{i}.BSS.{i}.SSID"
      interval: 3600
    - path: "Device.WiFi.DataElements.Network.Device.{i}.Radio.{i}.BSS.{i}.UnicastBytesSent"
      interval: 0
    - path: "Device.WiFi.DataElements.Network.Device.{i}.Radio.{i}.BSS.{i}.UnicastBytesReceived"
      interval: 0
    # --- Per-station measurements ---
    # The same client facts TR-181 proper keeps on AssociatedDevice, but
    # for every station on every node of the mesh, which is how a client
    # on an extender reaches the per-client history at all. SignalStrength
    # is RCPI (dBm = raw/2 - 110), the client labels rule converts it.
    # LastConnectTime is seconds since association.
    - path: "Device.WiFi.DataElements.Network.Device.{i}.Radio.{i}.BSS.{i}.STA.{i}.MACAddress"
      interval: 0
    - path: "Device.WiFi.DataElements.Network.Device.{i}.Radio.{i}.BSS.{i}.STA.{i}.Hostname"
      interval: 0
    - path: "Device.WiFi.DataElements.Network.Device.{i}.Radio.{i}.BSS.{i}.STA.{i}.SignalStrength"
      interval: 0
    - path: "Device.WiFi.DataElements.Network.Device.{i}.Radio.{i}.BSS.{i}.STA.{i}.LastDataDownlinkRate"
      interval: 0
    - path: "Device.WiFi.DataElements.Network.Device.{i}.Radio.{i}.BSS.{i}.STA.{i}.LastDataUplinkRate"
      interval: 0
    - path: "Device.WiFi.DataElements.Network.Device.{i}.Radio.{i}.BSS.{i}.STA.{i}.LastConnectTime"
      interval: 0
    - path: "Device.WiFi.DataElements.Network.Device.{i}.Radio.{i}.BSS.{i}.STA.{i}.BytesSent"
      interval: 0
    - path: "Device.WiFi.DataElements.Network.Device.{i}.Radio.{i}.BSS.{i}.STA.{i}.BytesReceived"
      interval: 0
    - path: "Device.WiFi.DataElements.Network.Device.{i}.Radio.{i}.BSS.{i}.STA.{i}.RetransCount"
      interval: 0
    # Steering outcomes per station, and the network's totals. Attempts
    # against successes is the steering success rate; a station whose
    # attempts climb and successes do not is the sticky client.
    - path: "Device.WiFi.DataElements.Network.Device.{i}.Radio.{i}.BSS.{i}.STA.{i}.MultiAPSTA.SteeringSummaryStats.BTMAttempts"
      interval: 0
    - path: "Device.WiFi.DataElements.Network.Device.{i}.Radio.{i}.BSS.{i}.STA.{i}.MultiAPSTA.SteeringSummaryStats.BTMSuccesses"
      interval: 0
    - path: "Device.WiFi.DataElements.Network.Device.{i}.Radio.{i}.BSS.{i}.STA.{i}.MultiAPSTA.SteeringSummaryStats.BlacklistAttempts"
      interval: 0
    - path: "Device.WiFi.DataElements.Network.Device.{i}.Radio.{i}.BSS.{i}.STA.{i}.MultiAPSTA.SteeringSummaryStats.BlacklistSuccesses"
      interval: 0
    - path: "Device.WiFi.DataElements.Network.MultiAPSteeringSummaryStats.BTMAttempts"
      interval: 0
    - path: "Device.WiFi.DataElements.Network.MultiAPSteeringSummaryStats.BTMSuccesses"
      interval: 0
    - path: "Device.WiFi.DataElements.Network.MultiAPSteeringSummaryStats.BlacklistAttempts"
      interval: 0
    - path: "Device.WiFi.DataElements.Network.MultiAPSteeringSummaryStats.BlacklistSuccesses"
      interval: 0
    # --- Backhaul ---
    # The extender's link to its parent as the extender measures it.
    # SignalStrength is RCPI like the station's. This is the tree to
    # read backhaul from: Device.WiFi.MultiAP is deleted in TR-181 2.21.
    - path: "Device.WiFi.DataElements.Network.Device.{i}.MultiAPDevice.Backhaul.Stats.SignalStrength"
      interval: 0
    - path: "Device.WiFi.DataElements.Network.Device.{i}.MultiAPDevice.Backhaul.Stats.LinkUtilization"
      interval: 0
    - path: "Device.WiFi.DataElements.Network.Device.{i}.MultiAPDevice.Backhaul.Stats.LastDataDownlinkRate"
      interval: 0
    - path: "Device.WiFi.DataElements.Network.Device.{i}.MultiAPDevice.Backhaul.Stats.LastDataUplinkRate"
      interval: 0
    - path: "Device.WiFi.DataElements.Network.Device.{i}.MultiAPDevice.Backhaul.Stats.BytesSent"
      interval: 0
    - path: "Device.WiFi.DataElements.Network.Device.{i}.MultiAPDevice.Backhaul.Stats.BytesReceived"
      interval: 0
    # --- DFS state ---
    # The channels radar has closed to this device, from its latest
    # Channel Availability Check report. The list changes when radar is
    # heard or a non-occupancy period ends; the countdown on each entry
    # is not collected because it would be a row per poll per channel.
    - path: "Device.WiFi.DataElements.Network.Device.{i}.CACStatus.{i}.CACNonOccupancyChannel.{i}.OpClass"
      interval: 900
    - path: "Device.WiFi.DataElements.Network.Device.{i}.CACStatus.{i}.CACNonOccupancyChannel.{i}.Channel"
      interval: 900
