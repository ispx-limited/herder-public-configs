# Per-client WiFi labels from the standard trees.
#
# Walks TR-181, TR-098 and Wi-Fi Data Elements paths only, no vendor
# X_ extensions, and emits the wifi.client.* metric set that every
# vendor script maps its own leaves onto: the console's client radar,
# the RF timeline and the experience score read these names and no
# others. The script's header lists the set.
#
# Every rule whose selector matches a device runs on it, so this rule
# and a vendor's both run on that vendor's hardware. They complement:
# this one emits what the standard leaves carry, the vendor's emits what
# only its X_ leaves carry, under the same names and the same labels, so
# the labeled query API collapses them to one row per client per metric.
#
# Selector: every TR-069/TR-369 device the bundled telemetry profiles
# match (no manufacturer constraint).
apiVersion: telemetry.herder.io/v1alpha1
kind: EnrichmentRule
metadata:
  name: generic-client-wifi
spec:
  priority: 200
  deviceSelector:
    matchExpressions:
      - key: oui
        operator: Exists
  config:
    # Data Elements STA.SignalStrength is RCPI (0 to 220, dBm = raw/2 - 110)
    # on every implementation seen. Set dbm for a firmware that reports dBm.
    dataElementsSignal: rcpi
  script: client-wifi-labels.ts
