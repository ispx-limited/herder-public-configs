# The fleet the golden is computed over: one label set per device
# family this bundle knows, as the selector engine sees it.
#
# `herder config check . --fleet .herder/fleet.yaml --golden
# .herder/resolution.golden.yaml` validates the bundle, lints it, then
# resolves every kind for every row here and compares the result to
# the golden. It lives in a dot directory because the config walker
# skips those: a YAML file without a kind envelope anywhere else in
# the tree is a document a sync refuses. A vendor change may move
# only its own rows; any other row moving is the regression (Herder
# ADR 0026). A family that is not listed is not protected, so a new
# vendor's survey adds its rows here before it writes a vendors/
# directory.
#
# Identity fields are what the unit reports in its Inform DeviceId
# (oui, manufacturer, productClass) and what Herder derives from the
# first session (dataModels from the tree root, protocols from the
# transport). Values come from units in service or from the cpe-labs
# reference profiles modelled on them; a documentation OUI (00005E)
# marks a family whose real OUI has not been recorded yet.
devices:
  # ---- ARRIS: TR-098 gateways and a mesh extender -------------------
  - name: arris-nvg578lx
    oui: "0000C5"
    manufacturer: ARRIS
    productClass: NVG578LX
    dataModels: [igd]
    protocols: [cwmp]
  - name: arris-nvg599
    oui: "0000C5"
    manufacturer: ARRIS
    productClass: NVG599
    dataModels: [igd]
    protocols: [cwmp]
  # The extender is TR-181; the Arris TR-098 profiles used to match it
  # on the manufacturer and fault on every path.
  - name: arris-x5042
    oui: "0000C5"
    manufacturer: ARRIS
    productClass: X5042
    dataModels: [device]
    protocols: [cwmp]

