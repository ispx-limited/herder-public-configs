# Credential check: does this username and password authenticate,
# answered by the CPE itself. TR-181 2.18 and later.
#
# The password is a secret input: sealed for the one write that carries
# it, masked on the run row, in the capabilities echo and in the
# normalizer. The platform refuses to start the run at all on a
# deployment with no encryption key, because the alternative is a
# password stored somewhere readable.
apiVersion: actions.herder.io/v1alpha1
kind: ActionProfile
metadata:
  name: check-credentials-tr181
spec:
  capability: check_credentials
  priority: 10
  deviceSelector:
    matchExpressions:
      - key: "dataModel:device"
        operator: Exists
  timeout: 3m
  inputs:
    - name: username
      description: Username to verify
      required: true
    - name: password
      description: Password to verify
      required: true
      secret: true
  steps:
    - name: check
      set:
        Device.Users.CheckCredentialsDiagnostics.Username: "{{ .input.username }}"
        Device.Users.CheckCredentialsDiagnostics.Password: "{{ .input.password }}"
        Device.Users.CheckCredentialsDiagnostics.DiagnosticsState: Requested
      awaitParam: Device.Users.CheckCredentialsDiagnostics.DiagnosticsState
      awaitNotIn: [Requested, None]
      pollInterval: 5s
      timeout: 2m
      collect:
        - Device.Users.CheckCredentialsDiagnostics.DiagnosticsState
  normalize: platform/actions/check-credentials.ts
