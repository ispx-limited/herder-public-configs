# Baseline speedtest, TR-143 HTTP.
#
# Provides the `speedtest` capability on any CPE exposing the standard
# TR-143 diagnostics. Priority 10, so a vendor implementation at 50 or
# above wins on hardware that has something better. That matters here
# more than for most profiles: the HTTP transfer runs on the CPE's own
# CPU, so on a multi-gigabit line it measures the device rather than the
# circuit, and a chipset-accelerated vendor test is not just faster but
# measuring a different thing.
#
# Download and upload run as separate steps rather than together. TR-143
# has one DiagnosticsState per direction and a CPE running both at once
# would have each test competing with the other for the same line, which
# is not what either number is meant to represent.
#
# The test server comes from config, falling back to the deployment-wide
# DIAGNOSTICS_TEST_SERVER. An operator with regional servers overrides it
# per profile copy and scopes each with a narrower selector.
apiVersion: actions.herder.io/v1alpha1
kind: ActionProfile
metadata:
  name: speedtest-tr143
spec:
  capability: speedtest
  title: Speed test
  priority: 10

  # TR-098 devices. The TR-181 equivalent lives under
  # Device.IP.Diagnostics.*, which is a different parameter tree and so a
  # separate profile rather than a branch inside this one.
  deviceSelector:
    matchExpressions:
      - key: "dataModel:igd"
        operator: Exists

  config:
    # Both directions run time-based (TR-143 section 4.3) for this many
    # seconds: the server streams for a fixed duration instead of a
    # fixed size, so the test measures a sustained rate at any line
    # speed and lasts long enough to watch. The data model caps
    # TimeBasedTestDuration at 999 seconds; eight is the default because
    # a diagnostic should cost the subscriber's line seconds, not
    # minutes. Firmware that ignores TimeBasedTestDuration on upload
    # needs a vendor profile with a sized upload instead.
    test_seconds: "8"

  # Generous, because the step timeouts are what actually bound the work
  # and this only has to stop a run whose steps individually stay under
  # budget from running forever.
  timeout: 20m

  steps:
    - name: download
      set:
        # The ref tag is this run's id, so the test server's /live
        # endpoint can attribute the in-flight transfer to exactly this
        # run — that is what moves the UI needle on measured bytes while
        # the CPE is still silent.
        canonical.diagnostics.download.url: "{{ .config.test_server }}/dntimebasedmode_{{ .config.test_seconds }}.txt?ref={{ .run.id }}"
        # Writing Requested is what starts the test. It must be set in
        # the same RPC as the URL, or the CPE starts against whatever
        # URL it still held.
        canonical.diagnostics.download.state: Requested
      awaitParam: canonical.diagnostics.download.state
      # Anything outside this set is terminal, including the several
      # Error_* values TR-143 defines. Listing only the success value
      # would leave a failed test polling until it timed out instead of
      # reporting why it failed.
      awaitNotIn: [Requested, None]
      pollInterval: 5s
      timeout: 5m
      probe:
        # Filtered server-side to this run's transfers: attribution is
        # transactional (the ref minted per run), never by peer address,
        # which NAT makes ambiguous.
        url: "{{ .config.probe_server }}/live?ref={{ .run.id }}"
        interval: 1s
      collect:
        - InternetGatewayDevice.DownloadDiagnostics.
    - name: upload
      set:
        canonical.diagnostics.upload.url: "{{ .config.test_server }}/upload?ref={{ .run.id }}"
        canonical.diagnostics.upload.test_file_length: "0"
        InternetGatewayDevice.UploadDiagnostics.TimeBasedTestDuration: "{{ .config.test_seconds }}"
        canonical.diagnostics.upload.state: Requested
      awaitParam: canonical.diagnostics.upload.state
      awaitNotIn: [Requested, None]
      pollInterval: 5s
      timeout: 5m
      probe:
        url: "{{ .config.probe_server }}/live?ref={{ .run.id }}"
        interval: 1s
      collect:
        - InternetGatewayDevice.UploadDiagnostics.

  normalize: platform/actions/speedtest-tr143.ts
