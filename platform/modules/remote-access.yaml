# Remote access to the CPE's own web UI: whether the subscriber's
# gateway answers management HTTP from the WAN, on which port, over
# which protocol. The support call it exists for is "turn my remote
# access on and lock it down", and the fleet posture question is "how
# many gateways have it open at all".
#
# The generic half is identical across TR-098 and TR-181, which almost
# never happens: UserInterface.RemoteAccess carries the same four
# leaves in both. Vendor reality adds the parts worth having: the ARRIS
# exposes an ACL (the lock-down-to-an-address the support call asks
# for), session timeouts and a live status, mapped in the vendor table
# and rendered here as fields that simply do not resolve elsewhere.
apiVersion: modules.herder.io/v1alpha1
kind: ServiceModule
metadata:
  name: remote-access
spec:
  # A noun phrase, and short. This renders as the panel subtitle, which
  # is read a thousand times by someone on their way to a number, and
  # the fields it used to enumerate are listed directly underneath it.
  description: WAN access to the management UI
  fields:
    # Types mirror the data model's own declarations (Enable and the
    # ARRIS status are xsd:boolean in the XML, the ports unsignedInt),
    # because the console renders by this field: a boolean that claims
    # to be a string renders as the text "1".
    #
    # Most of these fields carried a description that said the label
    # again in a longer form ("Port" / "TCP port the remote UI listens
    # on"). Helper text under a control is read every time the panel is;
    # earning that space means saying something the label cannot. The
    # three left are the three that do.
    - name: enabled
      canonical: canonical.mgmt.remote_access.enable
      type: bool
      writable: true
    - name: port
      canonical: canonical.mgmt.remote_access.port
      type: int
      writable: true
      constraints:
        min: 1
        max: 65535
    - name: protocol
      canonical: canonical.mgmt.remote_access.protocol
      type: string
      writable: true
    - name: supported_protocols
      canonical: canonical.mgmt.remote_access.supported_protocols
      type: string
    - name: status
      canonical: canonical.mgmt.remote_access.status
      type: bool
      # Worth saying: this is what the box is doing, where `enabled` is
      # what it was told to do, and they can disagree.
      description: Live state, not the configured setting.
    - name: allowed_addresses
      canonical: canonical.mgmt.remote_access.acl
      type: string
      writable: true
      # Verified on ARRIS NVG578LX a production firmware build: empty is allow,
      # not deny, and a listed source is enforced at the transport layer.
      # Nobody can guess that, and guessing it the wrong way leaves a
      # gateway open while its ACL field looks configured.
      description: Empty allows any source. Accepts an address, a list, or CIDR.
    - name: username
      canonical: canonical.mgmt.remote_access.username
      description: The login the remote management password belongs to.
    - name: password
      canonical: canonical.mgmt.remote_access.password
      writable: true
      secret: true
      description: >-
        The remote management account's password. Write-only; a grant
        with generate rotates it and shows the credential once.
    - name: idle_timeout
      canonical: canonical.mgmt.remote_access.idle_timeout
      type: int
      writable: true
      constraints:
        min: 1
        max: 1440
      # The unit is the whole content.
      description: Minutes.
