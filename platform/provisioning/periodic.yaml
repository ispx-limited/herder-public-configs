apiVersion: provisioning.herder.io/v1alpha1
kind: ProvisioningRule
metadata:
  name: seed-periodic
spec:
  triggers:
    - periodic
  # Scoped to CWMP devices. The seed scripts write
  # `canonical.mgmt.connection_request_*` and the PeriodicInform pair —
  # TR-069 ManagementServer parameters that a TR-369 agent does not
  # implement, so on a USP device this rule could only ever produce a
  # failed task. USP contact provisioning gets its own rules when there
  # is USP-shaped seed configuration to apply.
  deviceSelector:
    matchExpressions:
      - key: "protocol:cwmp"
        operator: Exists
  desired:
    script: "periodic.ts"
  priority: 50
  enabled: true
