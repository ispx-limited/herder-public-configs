# Sagemcom FAST5598 (TR-181): the PPP account identity, so subscriber
# resolution covers this family the way the TR-098 trees already are.
apiVersion: telemetry.herder.io/v1alpha1
kind: TelemetryProfile
metadata:
  name: sagemcom-fast5598-identity
spec:
  priority: 50
  deviceSelector:
    matchExpressions:
      - key: productClass
        operator: In
        values: [FAST5598]
  parameters:
    - path: "Device.PPP.Interface.{i}.Username"
      interval: 0
---
# WAN posture for the experience score's wan dimension, TR-181 form:
# interface error counters for the error rate, device uptime for
# stability.
apiVersion: telemetry.herder.io/v1alpha1
kind: TelemetryProfile
metadata:
  name: sagemcom-fast5598-wan
spec:
  priority: 50
  deviceSelector:
    matchExpressions:
      - key: productClass
        operator: In
        values: [FAST5598]
  parameters:
    - path: "Device.Ethernet.Interface.{i}.Stats.ErrorsReceived"
      interval: 0
    - path: "Device.Ethernet.Interface.{i}.Stats.PacketsReceived"
      interval: 0
    - path: "Device.DeviceInfo.UpTime"
      interval: 0
---
# The remote management account's password. This firmware keeps its
# local accounts in the standard Device.Users.User table; WHICH
# instance is the remote account is this deployment's provisioning
# convention, not a property of the firmware. User 5 is ours. An
# operator whose fleet provisions a different slot changes the
# instance here, or overrides this one row from a higher-priority
# table.
apiVersion: mapping.herder.io/v1alpha1
kind: MappingTable
metadata:
  name: remote-access-fast5598
spec:
  mappings:
    - canonical: canonical.mgmt.remote_access.password
      valueType: string
      devicePath: Device.Users.User.5.Password
    # The same slot's username, read-only on the module: the login the
    # rotated password belongs to. Follows the slot above when an
    # operator changes it.
    - canonical: canonical.mgmt.remote_access.username
      valueType: string
      devicePath: Device.Users.User.5.Username
---
# A mapping profile replaces rather than extends, so the baseline
# TR-181-over-CWMP list is restated to keep it; the restatement is what
# scoping the password table to this model costs. Keep the list in step
# with baseline-tr181-cwmp (baseline/tr181/mappings.yaml).
apiVersion: mapping.herder.io/v1alpha1
kind: MappingProfile
metadata:
  name: sagemcom-fast5598-tr181
spec:
  priority: 50
  deviceSelector:
    matchExpressions:
      - key: productClass
        operator: In
        values: [FAST5598]
      - key: "dataModel:device"
        operator: Exists
      - key: "protocol:cwmp"
        operator: Exists
  parameterMappings:
    - device-info-tr181
    - firmware-tr181
    - mgmt-tr181
    - diagnostics-tr181
    - wifi-tr181
    - interfaces-tr181
    - voice-tr104i2
    - wifi-scan-tr181
    - wifi-capability-tr181
    - wifi-rf-tr181
    - netdiag-tr181
    - remote-access-tr181
    - remote-access-fast5598
    - nat-tr181
    - software-tr181
    - oriel-home-tr181
---
# Collect the remote account's username, never its password: a
# collected password is a password in telemetry history.
apiVersion: telemetry.herder.io/v1alpha1
kind: TelemetryProfile
metadata:
  name: sagemcom-fast5598-remote-access
spec:
  priority: 50
  deviceSelector:
    matchExpressions:
      - key: productClass
        operator: In
        values: [FAST5598]
  parameters:
    - path: "Device.Users.User.5.Username"
      interval: 0

