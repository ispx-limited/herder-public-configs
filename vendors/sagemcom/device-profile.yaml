# Device UI profile for the Sagemcom FAST5598 (TR-181): the full
# section showcase on Device.* hardware, including an access-point
# table the TR-098 profiles cannot offer. Rendered by the demo
# instance's TR-181 simulator.
apiVersion: deviceprofiles.herder.io/v1alpha1
kind: DeviceProfile
metadata:
  name: sagemcom-fast5598-ui
spec:
  priority: 50
  deviceSelector:
    matchExpressions:
      - key: productClass
        operator: In
        values: [FAST5598]
  sections:
    - key: overview
      title: Overview
      icon: gauge
      component: overview
    - key: status
      title: Device status
      icon: info
      component: form
      config:
        groups:
          - title: Identity
            fields:
              - {label: Manufacturer, canonical: canonical.device.manufacturer}
              - {label: Model, canonical: canonical.device.model_name}
              - {label: Product class, canonical: canonical.device.product_class}
              - {label: Serial number, canonical: canonical.device.serial_number}
              - {label: Firmware, canonical: canonical.device.software_version}
              - {label: Uptime, canonical: canonical.device.uptime, format: duration}
          - title: WAN
            fields:
              - {label: Link status, canonical: canonical.interface.wan.status}
              - {label: WAN IP address, canonical: canonical.interface.wan.ip_address}
              - {label: WAN MAC, canonical: canonical.interface.wan.mac}
          - title: Management
            fields:
              - {label: Connection request URL, canonical: canonical.mgmt.connection_request_url}
              - {label: Inform interval, canonical: canonical.mgmt.periodic_inform_interval, format: seconds}
    - key: interfaces
      title: Interfaces
      icon: ethernet-port
      component: ports
      config:
        ports:
          - {id: wan, label: WAN, kind: wan, entity: canonical.interface.wan}
          - {id: lan1, label: "1", kind: ethernet, entity: canonical.interface.lan.1}
          - {id: lan2, label: "2", kind: ethernet, entity: canonical.interface.lan.2}
          - {id: lan3, label: "3", kind: ethernet, entity: canonical.interface.lan.3}
          - {id: lan4, label: "4", kind: ethernet, entity: canonical.interface.lan.4}
          - {id: wifi24, label: 2.4 GHz, kind: wifi, entity: canonical.wifi.radio.1}
          - {id: wifi5, label: 5 GHz, kind: wifi, entity: canonical.wifi.radio.2}
    - key: wifi
      title: WiFi
      icon: wifi
      component: module
      config:
        module: wifi
    - key: voice
      title: Voice
      icon: phone
      component: module
      config:
        module: voice
    - key: network-map
      title: Network map
      icon: network
      component: topology
    - key: monitoring
      title: Monitoring
      icon: chart-line
      component: dashboard
      config:
        dashboard: tr181-traffic
    - key: dashboard
      title: Dashboard
      icon: layout-grid
      component: dashboard
    - key: actions
      title: Actions
      icon: zap
      component: actions
    - key: action-log
      title: Action log
      icon: history
      component: tasks
    - key: events
      title: Events
      icon: scroll-text
      component: events
    - key: remote-access
      title: Remote access
      icon: shield
      component: module
      config:
        module: remote-access
        # Where the gateway's own UI answers, assembled from the WAN
        # address plus this module's port and protocol. Declared here
        # rather than inferred: which address a management UI listens on
        # is an operator's question, and a console that guessed would be
        # wrong on any deployment that terminates elsewhere. The console
        # classifies the address and says plainly when it is private or
        # behind CGNAT, so a link that cannot work does not look like one
        # that can.
        link:
          address: canonical.interface.wan.ip_address
          port: port
          protocol: protocol
    - key: maintenance
      title: Maintenance
      icon: wrench
      component: maintenance
