# Device UI profile for the TP-Link EX820v (TR-181).
#
# The baseline TR-181 profile does not offer a Voice section, and it
# should not: most of a residential fleet has no VoiceService tree, and
# a tab that says "nothing resolved" on every device teaches an operator
# to ignore tabs. The EX820v has two FXS ports, so on this hardware the
# section is the point rather than an empty promise.
#
# That is the whole reason device profiles are selector-scoped. A
# capability that some hardware has and most does not belongs to a
# profile for that hardware, not to a baseline with a caveat.
apiVersion: deviceprofiles.herder.io/v1alpha1
kind: DeviceProfile
metadata:
  name: tplink-ex820v-ui
spec:
  priority: 50
  extends: baseline-tr181-ui
  deviceSelector:
    matchExpressions:
      - key: productClass
        operator: In
        values: [EX820v]
  # The baseline's inventory plus the two FXS ports, which is why this
  # model declares one at all: a voice line is a socket on the back of
  # the unit and belongs on the faceplate with the others.
  ports:
    - {id: wan, label: WAN, kind: wan, entity: canonical.interface.wan}
    - {id: lan, kind: ethernet, entity: canonical.interface.lan.*}
    - {id: wifi24, label: 2.4 GHz, kind: wifi, entity: canonical.wifi.radio.1}
    - {id: wifi5, label: 5 GHz, kind: wifi, entity: canonical.wifi.radio.2}
    - {id: voice1, label: Line 1, kind: voice, entity: canonical.voice.line.1}
    - {id: voice2, label: Line 2, kind: voice, entity: canonical.voice.line.2}
  dropSections:
    # No port forwarding module on this hardware.
    - port-forwards
  sections:
    - key: voice
      title: Voice
      icon: phone
      component: module
      config:
        module: voice
