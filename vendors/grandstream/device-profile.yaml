# The device page for a Grandstream HT80x analogue telephone adapter.
#
# Without a profile of its own an ATA falls through to
# baseline-tr181-ui, which is gateway shaped: it renders Interfaces,
# WiFi, Network map, Port forwards and Remote access, five sections
# this hardware can never fill, and no Voice section at all. The only
# thing the device does was the one thing the page did not show.
#
# Deliberately short. A section that cannot hold data is worse than a
# missing one: it teaches an operator that empty panels are normal
# here, and then a real outage looks like the furniture.
#
# The mapping half is vendors/grandstream/ht80x.yaml, and it matters:
# this firmware speaks TR-104 issue 1, so the Voice section resolves
# only through the voice-tr104-device table that profile binds.
apiVersion: deviceprofiles.herder.io/v1alpha1
kind: DeviceProfile
metadata:
  name: grandstream-ht80x-ui
spec:
  priority: 50
  extends: baseline-tr181-ui
  deviceSelector:
    matchExpressions:
      - {key: "productClass", operator: In, values: ["HT801"]}
  dropSections: [interfaces, wifi, network-map, port-forwards, remote-access]
  sections:
    # Identity only. An ATA has no WAN group to show and no management
    # URL worth a row beside two telephone lines.
    - key: status
      title: Device status
      icon: info
      component: form
      config:
        groups:
          - title: Identity
            fields:
              - {label: Manufacturer, canonical: canonical.device.manufacturer}
              - {label: Model, canonical: canonical.device.model_name}
              - {label: Product class, canonical: canonical.device.product_class}
              - {label: Serial number, canonical: canonical.device.serial_number}
              - {label: Hardware version, canonical: canonical.device.hardware_version}
              - {label: Firmware, canonical: canonical.device.software_version}
              - {label: Uptime, canonical: canonical.device.uptime, format: duration}
    - key: voice
      title: Voice
      icon: phone
      component: stack
      config:
        sections:
          - key: voice-lines
            title: Lines
            component: lines
            config:
              lines:
                - {id: line1, label: Line 1, entity: canonical.voice.line.1}
          - key: voice-service
            title: Voice service
            component: module
            config:
              module: voice
---
# GWN7062 and GWN7002 routers. The TR-181 baseline page carries two
# sections this hardware can never fill: the model has no
# Device.NAT.PortMapping table and no Device.UserInterface.RemoteAccess
# object (both refused with 9005 on every unit of a production fleet,
# firmware 1.0.9.x and 1.0.11.x alike), so the port-forwards and
# remote-access sections stayed empty and each session logged the
# refusals. The network map stays: this model has no Device.Hosts and no
# Data Elements either, so the map is built from the AccessPoint
# association table by the grandstream-gwn-topology rule.
apiVersion: deviceprofiles.herder.io/v1alpha1
kind: DeviceProfile
metadata:
  name: grandstream-gwn70x2-ui
spec:
  priority: 50
  extends: baseline-tr181-ui
  deviceSelector:
    matchLabels:
      oui: "EC74D7"
    matchExpressions:
      - {key: "productClass", operator: In, values: ["GWN7062", "GWN7002"]}
  dropSections: [port-forwards, remote-access]
