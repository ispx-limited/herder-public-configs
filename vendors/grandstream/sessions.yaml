    - {path: "Device.Services.VoiceService.{i}.VoiceProfile.{i}.Line.{i}.Status", interval: 3600}
    - {path: "Device.WiFi.AccessPoint.{i}.AssociatedDevice.{i}.AuthenticationState", interval: 3600}
