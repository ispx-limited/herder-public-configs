# A Beacon extender's radios and Ethernet port, read leaf by leaf.
#
# A Nokia Beacon 2 running as a mesh agent answers fault 9005 to any
# partial-path read of InternetGatewayDevice.LANDevice.1.WLANConfiguration.
# (GetParameterValues and GetParameterNames alike) while every leaf
# under it reads fine one at a time, and the same for its Ethernet port
# and Hosts table. The baseline profiles read those trees as subtrees,
# so on an agent Herder records the tree as absent and the extender
# page has no radios, no clients and no port. Its gateway, the same
# hardware and firmware, serves the subtree read and needs none of
# this.
#
# So the agent's leaves are named one by one. The instance numbers are
# the Beacon's fixed layout: 1 to 4 are the 2.4 GHz radio and its
# SSIDs, 5 to 8 the 5 GHz ones. A leaf an instance does not have is
# rejected once and cached, which is the bisect's job. The associated
# device table is a wildcard under each instance, which is one
# GetParameterNames per SSID and is cached the same way if the agent
# refuses it. Scoped by the mesh:agent tag the mesh-role rule writes,
# so a gateway keeps its one-round-trip subtree read.
apiVersion: telemetry.herder.io/v1alpha1
kind: TelemetryProfile
metadata:
  name: nokia-beacon-agent-wlan-tr098
