# FastMile interfaces: the WAN is cellular, not Ethernet.
#
# The baseline interfaces-tr181 finds the WAN by an Ethernet port with
# Upstream=true and an IP interface with a /32 host route. The FastMile
# has neither: every Ethernet port reports Upstream=false and its
# cellular IP interface carries a /29, so the baseline maps the LAN
# bridge as the WAN and a dead Ethernet port's MAC as the WAN MAC.
#
# Here the WAN is the IP interface whose LowerLayers is the cellular
# access point, its byte counters come from the cellular stats (Ethernet
# stats are zero on a fixed-wireless unit), and it has no WAN MAC because
# a cellular interface has none. The LAN ports are the Ethernet
# interfaces directly, with no WAN offset, since no Ethernet port is the
# WAN. Listed in the profile in place of interfaces-tr181.
apiVersion: mapping.herder.io/v1alpha1
kind: MappingTable
metadata:
  name: interfaces-nokia-fastmile
spec:
  mappings:
    - canonical: canonical.interface.wan.status
      valueType: string
      instanceAlias:
        object: Device.IP.Interface.
        matchBy: LowerLayers
        matchValue: Device.Cellular.AccessPoint.1
        fallbackIndex: 3
      pathTemplate: Device.IP.Interface.{index}.Status
    - canonical: canonical.interface.wan.ip_address
      valueType: string
      instanceAlias:
        object: Device.IP.Interface.
        matchBy: LowerLayers
        matchValue: Device.Cellular.AccessPoint.1
        fallbackIndex: 3
      pathTemplate: Device.IP.Interface.{index}.IPv4Address.1.IPAddress
    - canonical: canonical.interface.wan.bytes_sent
      valueType: unsignedint
      devicePath: Device.Cellular.AccessPoint.1.X_ALU-COM_AccessPointStats.BytesSent
    - canonical: canonical.interface.wan.bytes_received
      valueType: unsignedint
      devicePath: Device.Cellular.AccessPoint.1.X_ALU-COM_AccessPointStats.BytesReceived
    - canonical: canonical.interface.lan.1.status
      valueType: string
      devicePath: Device.Ethernet.Interface.1.Status
    - canonical: canonical.interface.lan.1.mac
      valueType: string
      devicePath: Device.Ethernet.Interface.1.MACAddress
    - canonical: canonical.interface.lan.1.bytes_sent
      valueType: unsignedint
      devicePath: Device.Ethernet.Interface.1.Stats.BytesSent
    - canonical: canonical.interface.lan.1.bytes_received
      valueType: unsignedint
      devicePath: Device.Ethernet.Interface.1.Stats.BytesReceived
    - canonical: canonical.interface.lan.2.status
      valueType: string
      devicePath: Device.Ethernet.Interface.2.Status
    - canonical: canonical.interface.lan.2.mac
      valueType: string
      devicePath: Device.Ethernet.Interface.2.MACAddress
    - canonical: canonical.interface.lan.2.bytes_sent
      valueType: unsignedint
      devicePath: Device.Ethernet.Interface.2.Stats.BytesSent
    - canonical: canonical.interface.lan.2.bytes_received
      valueType: unsignedint
      devicePath: Device.Ethernet.Interface.2.Stats.BytesReceived
