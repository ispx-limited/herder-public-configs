# Arris NVG578LX-class topology rule.
#
# Walks the X_0000C5_Wireless.HNC.HNE table:
#   HNE.1 = gateway (Type=="Gateway")
#   HNE.2+ = paired extenders
# Backhaul links identified by the SSID name pattern in
# config.backhaulSsidMatch (default "^bh"). Cross-refs Hosts.Host by
# MAC for client metadata.
#
# Worked vendor-extension example demonstrating that proprietary path
# semantics live entirely in operator-supplied script content (per
# CLAUDE.md Architecture Principle #1).
apiVersion: telemetry.herder.io/v1alpha1
kind: EnrichmentRule
metadata:
  name: arris-hnc-topology
spec:
  priority: 100
  deviceSelector:
    matchExpressions:
      - key: manufacturer
        operator: In
        values: [Arris, ARRIS]
      - key: productClass
        operator: In
        values: [NVG578LX, NVG578LX1, NVG448BQ, NVG468MQ, NVG589, NVG599]
  triggerPaths:
    - "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.HNC.HNE.*"
    - "InternetGatewayDevice.LANDevice.1.Hosts.Host.*"
    - "InternetGatewayDevice.LANDevice.1.WLANConfiguration.*.AssociatedDevice.*"
  # The stations (the HNC table's and the gateway's own AssociatedDevice
  # table) are the map's clients, so a phone joining, leaving or moving
  # to another node or radio is a change to the graph. Hashing
  # only the nodes and the host table left the map as it was first drawn
  # until the heartbeat: a map drawn from a session without its stations
  # showed the gateway alone for hours while the clients were there.
  # The signal is hashed for the same reason: the edge colour is drawn
  # from it, and hashed out it stayed at the first reading for hours.
  changeHash:
    paths:
      - "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.HNC.HNE.{i}.MACAddress"
      - "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.HNC.HNE.{i}.Type"
      - "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.HNC.HNE.{i}.Radio.{i}.SSID.{i}.STA.{i}.MACAddress"
      - "InternetGatewayDevice.LANDevice.1.Hosts.Host.{i}.MACAddress"
      - "InternetGatewayDevice.LANDevice.1.Hosts.Host.{i}.Active"
      - "InternetGatewayDevice.LANDevice.1.Hosts.Host.{i}.Layer2Interface"
      - "InternetGatewayDevice.LANDevice.1.WLANConfiguration.{i}.AssociatedDevice.{i}.AssociatedDeviceMACAddress"
      - "InternetGatewayDevice.LANDevice.1.WLANConfiguration.{i}.AssociatedDevice.{i}.X_0000C5_RSSI"
      - "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.HNC.HNE.{i}.Radio.{i}.SSID.{i}.STA.{i}.RSSI"
  coalesceWindow: 60s
  config:
    # Regex matched against SSID name; matching SSIDs are treated as
    # backhaul links between mesh nodes (not client-facing).
    backhaulSsidMatch: "^bh"
    # rssiEncoding: "rcpi" or "dbm". Arris firmware in the wild reports
    # both depending on version.
    rssiEncoding: dbm
    includeInactiveHosts: false
  script: arris-hnc.ts
