# Profile for Arris NVG series TR-098 devices.
#
# Arris NVG residential gateways use the InternetGatewayDevice data model.
# Matched by OUI + product class. Operators should add more product classes
# as they onboard additional Arris models.
apiVersion: mapping.herder.io/v1alpha1
kind: MappingProfile
metadata:
  name: arris-nvg-tr098
spec:
  priority: 50
  deviceSelector:
    matchLabels:
      oui: "0000C5"
    matchExpressions:
      - key: productClass
        operator: In
        values:
          - "NVG578LX"
          - "NVG578LX1"
          - "NVG448BQ"
          - "NVG468MQ"
          - "NVG589"
          - "NVG599"
  parameterMappings:
    - device-info-tr098
    - mgmt-tr098
    - diagnostics-tr098
    - wifi-tr098
    - wifi-bssid-tr098
    - wifi-capability-tr098
    # Channel width under the vendor prefix; TR-098 has no standard one.
    - wifi-arris
    - interfaces-tr098
    - voice-tr104
    # Neighbour scan under the vendor X_0000C5_ subtree. Binding it here
    # is what gives an NVG the wifi_scan capability: the action sets
    # canonical.wifi.scan.state, and without this table that canonical
    # resolves to nothing on a TR-098 device.
    - wifi-scan-arris
    - netdiag-tr098
    - remote-access-tr098
    - remote-access-arris
    # Port forwards with the NVG's routed connection (WANIPConnection.2)
    # pinned; binds instead of the baseline nat-tr098, see nat.yaml.
    - nat-arris
---
# Telemetry profile: Arris TR-098 WiFi + mesh extensions.
#
# Vendor-specific X_0000C5_* parameters on top of the tr098-* baseline.
# Covers the paths that power per-client WiFi history, mesh-aware
# dashboards, and the ingest-time label-enrichment SDK's raw input:
#
#   * Extender-attached clients (HNC.HNE tree) — RSSI, MAC, TxPHYRate
#   * Gateway-attached clients with the Arris-reported signal, byte
#     counters and association age
#     (AssociatedDevice.X_0000C5_{RSSI,BytesSent,BytesReceived,TimeAssociated})
#   * Per-client steering counters (HNC.Steer.SummaryStats)
#   * Per-radio noise floor and channel utilisation, and the channel
#     change history, the RF facts TR-098 has no standard leaf for
#   * Mesh ESS identity (HNC.ESS.1.ESSName)
#   * Ethernet/WLAN X_0000C5_ link-rate + frequency-band extensions
#   * Host LastActive timestamp
#
# All passive (interval: 0). Vendor priority 50 — overrides the
# generic TR-098 baseline at priority 10 on any conflicting path.
# The X_0000C5_* extensions in this file don't overlap with the
# baseline; priority 50 is the vendor-tier slot by convention.
#
# Deliberately excluded from the operator's full parameter set:
#   * All SET operations (UserInterface.RemoteAccess.*, etc)
#   * Security-sensitive (KeyPassphrase, Security.KeyPassphrase)
#   * Diagnostic triggers (NeighboringWiFiDiagnostic, Download/Upload)
#   * Non-Arris paths (X_SAGEMCOM_* and other vendors' X_* prefixes)
#   * TR-181 Device.* paths (covered by the default tr181-*.yaml set)
#   * Paths already in the default tr098-*.yaml set
#   * SummaryStats.STA.*.MaximumNumberOfEntries / NumberNoAP
#     (low operational value)
#   * AssociatedDevice.X_0000C5_SignalStrength, a percentage beside
#     the dBm X_0000C5_RSSI the signal is read from
#
# What only this firmware reports is collected too and emitted under
# the x.arris names: the steering counters beyond attempts and
# successes, a client's disassociation and deauthentication counts, the
# link quality and the signal as the client itself measures it, and the
# radio's average SNR and errored packets. The association history is
# the firmware's own session log, collected raw for the readers that
# build sessions.
#   * Generic HNC.HNE.*.* wildcard-at-leaf catch-all (replaced by
#     the specific STA.* paths underneath)
#
# Match: manufacturer is "Arris" or "ARRIS" — firmware reports one
# or the other across the product family. OUI is deliberately not
# constrained. Arris/CommScope ships under multiple OUI blocks, and
# the X_0000C5_* paths are self-selecting anyway (a non-Arris CPE
# wouldn't expose these paths even if it matched the manufacturer).
# The product class is: these are TR-098 paths, and Arris also makes
# TR-181 hardware (the X5042 extender reports manufacturer ARRIS), on
# which every one of them faults. The list is the mapping profile's.
apiVersion: telemetry.herder.io/v1alpha1
kind: TelemetryProfile
metadata:
  name: arris-wifi-tr098
spec:
  priority: 50
  deviceSelector:
    matchExpressions:
      - key: manufacturer
        operator: In
        values: [Arris, ARRIS]
      - key: productClass
        operator: In
        values: [NVG578LX, NVG578LX1, NVG448BQ, NVG468MQ, NVG589, NVG599]
  parameters:
    # --- Mesh ESS identity ---
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.HNC.ESS.1.ESSName"
      interval: 0
    # --- Gateway-attached WiFi clients (standard TR-098 MAC + Arris extensions) ---
    # AssociatedDeviceMACAddress anchors the client MAC per (WLAN idx,
    # AssociatedDevice idx) tuple so the enrichment script can correlate
    # with the X_0000C5_WLANStats.*.AssociatedDevice.*.Stats.*.ClientRSSI
    # tree below (same index tuple on both sides).
    - path: "InternetGatewayDevice.LANDevice.1.WLANConfiguration.{i}.AssociatedDevice.{i}.AssociatedDeviceMACAddress"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.WLANConfiguration.{i}.AssociatedDevice.{i}.X_0000C5_RSSI"
      interval: 0
    # Bytes each way and seconds associated, the vendor spellings of
    # what TR-181 keeps on AssociatedDevice.Stats and AssociationTime.
    - path: "InternetGatewayDevice.LANDevice.1.WLANConfiguration.{i}.AssociatedDevice.{i}.X_0000C5_BytesSent"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.WLANConfiguration.{i}.AssociatedDevice.{i}.X_0000C5_BytesReceived"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.WLANConfiguration.{i}.AssociatedDevice.{i}.X_0000C5_TimeAssociated"
      interval: 0
    # How often the gateway has dropped this client, each way. Monotonic
    # per association; the disconnect signal the sessions reader wants.
    - path: "InternetGatewayDevice.LANDevice.1.WLANConfiguration.{i}.AssociatedDevice.{i}.X_0000C5_DisassociationsCount"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.WLANConfiguration.{i}.AssociatedDevice.{i}.X_0000C5_DeauthenticationCount"
      interval: 0
    # --- Per-radio RF (vendor leaves; TR-098 has none) ---
    # Noise floor in dBm on each WLAN, read by wifi-arris as
    # canonical.wifi.radio.{i}.noise. Channel utilisation as a
    # percentage lives on the mesh tree's radio rows, HNE.1 being the
    # gateway. The channel change history is the firmware's own record
    # of every move with its reason; a table, so it is collected raw and
    # diffed by a reader rather than mapped to a scalar.
    - path: "InternetGatewayDevice.LANDevice.1.WLANConfiguration.{i}.X_0000C5_Noise"
      interval: 0
    # Average SNR in tenths of a dB and the errored packet counter, per
    # WLAN; nothing standard carries either on a TR-098 radio, so they
    # map to the x.arris radio canonicals.
    - path: "InternetGatewayDevice.LANDevice.1.WLANConfiguration.{i}.X_0000C5_AverageSNR"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.WLANConfiguration.{i}.X_0000C5_PacketsErrored"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.HNC.HNE.{i}.Radio.{i}.ChanUtilization"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.ChannelChangeHistory.{i}.Radio"
      interval: 900
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.ChannelChangeHistory.{i}.Channel"
      interval: 900
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.ChannelChangeHistory.{i}.LastChannel"
      interval: 900
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.ChannelChangeHistory.{i}.Reason"
      interval: 900
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.ChannelChangeHistory.{i}.ChannelChangeTime"
      interval: 900
    # --- Per-client WLAN stats (Arris RSSI tree) ---
    # The real RSSI path on NVG/SURFboard firmware — AssociatedDevice lives
    # at WLANStats.<wlan>.AssociatedDevice.<ad>.Stats.<n>.ClientRSSI.
    # RSSI and Noise are what the gateway hears (the uplink, which the
    # canonical signal means); ClientRSSI and ClientNoise are the
    # client's own readings of the downlink, which only this firmware
    # relays, so they ride the x.arris names. LinkQuality is 0 to 100.
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_WLANStats.{i}.AssociatedDevice.{i}.Stats.{i}.RSSI"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_WLANStats.{i}.AssociatedDevice.{i}.Stats.{i}.Noise"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_WLANStats.{i}.AssociatedDevice.{i}.Stats.{i}.ClientRSSI"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_WLANStats.{i}.AssociatedDevice.{i}.Stats.{i}.ClientNoise"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_WLANStats.{i}.AssociatedDevice.{i}.Stats.{i}.LinkQuality"
      interval: 0
    # The firmware's own log of associations, one row per join with the
    # client and the time. A session reader diffs it; nothing maps it.
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_WLANStats.{i}.AssociationHistory.{i}.MACAddress"
      interval: 900
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_WLANStats.{i}.AssociationHistory.{i}.AssociationTime"
      interval: 900
    # --- Mesh node identity (HNC.HNE tree) ---
    # The arris-hnc topology rule roots the mesh off these: HNE.{i}.Type
    # ("Gateway"/extender) + HNE.{i}.MACAddress identify each node, and the
    # Radio band + SSID name classify client edges (2.4/5/6 GHz) and skip
    # backhaul SSIDs. Without these the script sees only STA leaves and
    # can't resolve the gateway.
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.HNC.HNE.{i}.MACAddress"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.HNC.HNE.{i}.Type"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.HNC.HNE.{i}.Model"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.HNC.HNE.{i}.SoftwareVersion"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.HNC.HNE.{i}.Radio.{i}.OperatingFrequencyBand"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.HNC.HNE.{i}.Radio.{i}.SSID.{i}.SSID"
      interval: 0
    # --- Extender-attached WiFi clients (HNC mesh tree) ---
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.HNC.HNE.{i}.Radio.{i}.SSID.{i}.STA.{i}.MACAddress"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.HNC.HNE.{i}.Radio.{i}.SSID.{i}.STA.{i}.RSSI"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.HNC.HNE.{i}.Radio.{i}.SSID.{i}.STA.{i}.TxPHYRate"
      interval: 0
    # --- Per-client steering stats (HNC.Steer.SummaryStats) ---
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.HNC.Steer.SummaryStats.STA.{i}.MACAddress"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.HNC.Steer.SummaryStats.STA.{i}.STAStatus"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.HNC.Steer.SummaryStats.STA.{i}.BandSupport"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.HNC.Steer.SummaryStats.STA.{i}.DualBandCapable"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.HNC.Steer.SummaryStats.STA.{i}.BTMAttempts"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.HNC.Steer.SummaryStats.STA.{i}.BTMSuccesses"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.HNC.Steer.SummaryStats.STA.{i}.BlacklistAttempts"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.HNC.Steer.SummaryStats.STA.{i}.BlacklistSuccesses"
      interval: 0
    # The rest of the steering record, only this firmware's and emitted
    # under x.arris: the client's own moves, the unfriendly flag, the
    # events that caused steer attempts, and how long since the last one.
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.HNC.Steer.SummaryStats.STA.{i}.LastSteerTime"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.HNC.Steer.SummaryStats.STA.{i}.SelfSteerCount"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.HNC.Steer.SummaryStats.STA.{i}.SteeringUnfriendly"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.HNC.Steer.SummaryStats.STA.{i}.WiFiChannelUtilizationEvents"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.HNC.Steer.SummaryStats.STA.{i}.WiFiLinkQualityEvents"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.HNC.Steer.SummaryStats.STA.{i}.BHUtilizationEvents"
      interval: 0
    # --- Host "last active" timestamp (Arris extension) ---
    - path: "InternetGatewayDevice.LANDevice.1.Hosts.Host.{i}.X_0000C5_LastActive"
      interval: 0
    # --- WLAN X_0000C5 link-layer extensions ---
    - path: "InternetGatewayDevice.LANDevice.1.WLANConfiguration.{i}.X_0000C5_CurrentBitRate"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.WLANConfiguration.{i}.X_0000C5_CurrentDuplexMode"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.WLANConfiguration.{i}.X_0000C5_OperatingFrequencyBand"
      interval: 0
    # Read by wifi-arris as canonical.wifi.radio.{i}.bandwidth. A
    # setting, so it rides the bucket the TR-181 baseline gives the
    # standard width.
    - path: "InternetGatewayDevice.LANDevice.1.WLANConfiguration.{i}.X_0000C5_OperatingChannelBandwidth"
      interval: 900
    # --- LAN Ethernet X_0000C5 link-layer extensions ---
    - path: "InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.{i}.X_0000C5_CurrentBitRate"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.{i}.X_0000C5_CurrentDuplexMode"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.LANEthernetInterfaceConfig.{i}.X_0000C5_OperatingFrequencyBand"
      interval: 0
    # --- Neighbour scan results, the vendor table ---
    # The NVG keeps the last scan's results under X_0000C5_Wireless, and
    # the wifi-scan-arris mapping table reads them as canonical.wifi.scan.
    # Until this block they were only ever stored when an operator ran
    # the wifi_scan action, so the RF neighbours section was empty on
    # every gateway nobody had clicked. Same leaf set and cadence as the
    # TR-181 baseline, and no SSID: a neighbour's network name is third
    # party data the graph does not need.
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.NeighboringWiFiDiagnostic.DiagnosticsState"
      interval: 900
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.NeighboringWiFiDiagnostic.ResultNumberOfEntries"
      interval: 900
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.NeighboringWiFiDiagnostic.Result.{i}.Radio"
      interval: 900
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.NeighboringWiFiDiagnostic.Result.{i}.BSSID"
      interval: 900
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.NeighboringWiFiDiagnostic.Result.{i}.Channel"
      interval: 900
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.NeighboringWiFiDiagnostic.Result.{i}.SignalStrength"
      interval: 0
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.NeighboringWiFiDiagnostic.Result.{i}.OperatingFrequencyBand"
      interval: 900
    - path: "InternetGatewayDevice.LANDevice.1.X_0000C5_Wireless.NeighboringWiFiDiagnostic.Result.{i}.Bandwidth"
      interval: 900
---
# Arris TR-098 per-client WiFi labels.
#
# Emits the baseline's wifi.client.* names from the X_0000C5_ leaves,
# per Inform, from three independent source trees; each section is
# silent when the firmware does not expose its tree, so one rule covers
# several Arris variants:
#
#   1. HNC.Steer.SummaryStats.STA.*  — the steering counters per client,
#      kept even on a gateway with no client currently associated.
#   2. WLANConfiguration.*.AssociatedDevice.* + X_0000C5_WLANStats tree —
#      signal, bytes and association age on gateway-attached clients.
#   3. X_0000C5_Wireless.HNC.HNE.*.Radio.*.SSID.*.STA.* — extender
#      clients (present when a paired extender is Informed).
#
# The baseline rule runs on the same device and emits the transmit rate
# from the standard table under the same labels; the two sets of rows
# collapse to one per client per metric in the labeled query API. What
# only this firmware reports is emitted under wifi.client.x.arris.*,
# the vendor namespace the bundle lint holds every directory to.
#
# Depends on the arris-wifi-tr098 telemetry profile above. Without it
# the script runs and emits nothing.
#
# Selector matches CPE whose manufacturer string is "Arris" or "ARRIS" —
# firmware reports either across the product family. OUI not constrained
# (the X_0000C5_* paths are self-selecting).
apiVersion: telemetry.herder.io/v1alpha1
kind: EnrichmentRule
metadata:
  name: arris-client-wifi
spec:
  priority: 50
  deviceSelector:
    matchExpressions:
      - key: manufacturer
        operator: In
        values: [Arris, ARRIS]
      - key: productClass
        operator: In
        values: [NVG578LX, NVG578LX1, NVG448BQ, NVG468MQ, NVG589, NVG599]
  script: arris-client-wifi-labels.ts
---
# WAN posture for the experience score's wan dimension: the error rate
# reads the per-connection Ethernet counters, stability reads the
# connection uptime with device uptime as fallback.
apiVersion: telemetry.herder.io/v1alpha1
kind: TelemetryProfile
metadata:
  name: arris-wan-tr098
spec:
  priority: 50
  deviceSelector:
    matchExpressions:
      - key: manufacturer
        operator: In
        values: [Arris, ARRIS]
      - key: productClass
        operator: In
        values: [NVG578LX, NVG578LX1, NVG448BQ, NVG468MQ, NVG589, NVG599]
  parameters:
    - path: "InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection.1.Stats.EthernetErrorsReceived"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection.1.Stats.EthernetPacketsReceived"
      interval: 0
    - path: "InternetGatewayDevice.WANDevice.1.WANConnectionDevice.1.WANIPConnection.1.Uptime"
      interval: 0
    - path: "InternetGatewayDevice.DeviceInfo.UpTime"
      interval: 0
