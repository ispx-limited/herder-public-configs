# Device UI profile for Arris NVG gateways.
#
# The TR-098 baseline plus a Voice section. Everything it resolves goes
# through the tables the arris-nvg-tr098 mapping profile binds, and the
# demo instance's TR-098 simulator renders this page.
#
# Selected on product class alone. An OUI scopes a manufacturer's whole
# catalogue rather than a model, and the same model ships under
# different OUIs between purchase batches, so a profile keyed on one
# both over-matches and under-matches.
apiVersion: deviceprofiles.herder.io/v1alpha1
kind: DeviceProfile
metadata:
  name: arris-nvg-ui
spec:
  priority: 50
  extends: baseline-tr098-ui
  deviceSelector:
    matchExpressions:
      - key: productClass
        operator: In
        values:
          - "NVG578LX"
          - "NVG578LX1"
          - "NVG448BQ"
          - "NVG468MQ"
          - "NVG589"
          - "NVG599"
  sections:
    - key: voice
      title: Voice
      icon: phone
      component: stack
      config:
        sections:
          - key: voice-lines
            title: Lines
            component: lines
            config:
              lines:
                - id: line1
                  label: Line 1
                  entity: canonical.voice.line.1
                - id: line2
                  label: Line 2
                  entity: canonical.voice.line.2
          - key: voice-service
            title: Voice service
            component: module
            config:
              module: voice
---
# The device page for an Arris X5042 mesh extender.
#
# Without a profile of its own it falls through to baseline-tr181-ui,
# which is gateway shaped, and the WAN group there is not merely empty
# on this hardware: it is wrong. canonical.interface.wan.status finds
# its instance by looking for a /32 IPv4 address, the shape a PPP
# session has, and canonical.interface.wan.mac by looking for the
# ethernet interface reporting Upstream true. An extender has neither,
# so both aliases fall through to their fallbackIndex of 1 and the page
# labels the LAN bridge's status as the WAN link and a downstream
# interface's MAC as the WAN MAC. On the unit this was written against,
# Device.Ethernet.Interface.1.Upstream reads 0 and its MAC was being
# shown as the WAN's.
#
# A panel that is confidently wrong costs more than a missing one: an
# operator reads "Link status: Up" and believes the uplink was checked.
# There is no WAN group here, and Interfaces, Port forwards and Remote
# access are gone with it; all three read through the same wrong alias
# or are gateway functions.
#
# What is kept is what the hardware does: its radios, the clients on
# them and the map they form. Selected on product class alone, never
# the OUI, which differs between purchase batches of the same model.
apiVersion: deviceprofiles.herder.io/v1alpha1
kind: DeviceProfile
metadata:
  name: arris-x5042-ui
spec:
  priority: 50
  extends: baseline-tr181-ui
  deviceSelector:
    matchExpressions:
      - {key: "productClass", operator: In, values: ["X5042"]}
  # No port inventory. This firmware reports its interfaces as eth0 and
  # eth1 with aliases cpe-ethintf-1 and cpe-ethintf-2, so the name is
  # the better of the two and the map already shows it. A profile only
  # needs to name ports where the CPE names them badly.
  dropSections: [interfaces, port-forwards, remote-access]
  sections:
    - key: status
      title: Device status
      icon: info
      component: form
      config:
        groups:
          - title: Identity
            fields:
              - {label: Manufacturer, canonical: canonical.device.manufacturer}
              - {label: Model, canonical: canonical.device.model_name}
              - {label: Product class, canonical: canonical.device.product_class}
              - {label: Serial number, canonical: canonical.device.serial_number}
              - {label: Hardware version, canonical: canonical.device.hardware_version}
              - {label: Firmware, canonical: canonical.device.software_version}
              - {label: Uptime, canonical: canonical.device.uptime, format: duration}
          - title: Management
            fields:
              - {label: Connection request URL, canonical: canonical.mgmt.connection_request_url}
              - {label: Inform interval, canonical: canonical.mgmt.periodic_inform_interval, format: seconds}
