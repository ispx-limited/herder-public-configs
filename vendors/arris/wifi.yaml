# Channel width and frequency band for ARRIS NVG gateways (TR-098).
#
# TR-098 declares neither, so the baseline wifi-tr098 table leaves
# canonical.wifi.radio.{i}.bandwidth and .band unmapped. The NVG data
# model declares both under its vendor prefix: the width read-write over
# the TR-181 vocabulary (20MHz, 40MHz, 80MHz, 160MHz, Auto), the band as
# 2.4GHz or 5GHz.
#
# The radio slots follow wifi-tr098 exactly, because a width has to
# land on the same WLANConfiguration instance as the channel it belongs
# to: slots 1 and 2, found by band off PossibleChannels, and no others.
apiVersion: mapping.herder.io/v1alpha1
kind: MappingTable
metadata:
  name: wifi-arris
spec:
  mappings:
    - canonical: canonical.wifi.radio.1.bandwidth
      valueType: string
      instanceAlias:
        object: InternetGatewayDevice.LANDevice.1.WLANConfiguration.
        matchBy: PossibleChannels
        matchValue: "1,"
        matchType: Prefix
        fallbackIndex: 1
      pathTemplate: InternetGatewayDevice.LANDevice.1.WLANConfiguration.{index}.X_0000C5_OperatingChannelBandwidth
    - canonical: canonical.wifi.radio.2.bandwidth
      valueType: string
      instanceAlias:
        object: InternetGatewayDevice.LANDevice.1.WLANConfiguration.
        matchBy: PossibleChannels
        matchValue: "36,"
        matchType: Prefix
        fallbackIndex: 2
      pathTemplate: InternetGatewayDevice.LANDevice.1.WLANConfiguration.{index}.X_0000C5_OperatingChannelBandwidth
    - canonical: canonical.wifi.radio.1.band
      valueType: string
      instanceAlias:
        object: InternetGatewayDevice.LANDevice.1.WLANConfiguration.
        matchBy: PossibleChannels
        matchValue: "1,"
        matchType: Prefix
        fallbackIndex: 1
      pathTemplate: InternetGatewayDevice.LANDevice.1.WLANConfiguration.{index}.X_0000C5_OperatingFrequencyBand
    - canonical: canonical.wifi.radio.2.band
      valueType: string
      instanceAlias:
        object: InternetGatewayDevice.LANDevice.1.WLANConfiguration.
        matchBy: PossibleChannels
        matchValue: "36,"
        matchType: Prefix
        fallbackIndex: 2
      pathTemplate: InternetGatewayDevice.LANDevice.1.WLANConfiguration.{index}.X_0000C5_OperatingFrequencyBand