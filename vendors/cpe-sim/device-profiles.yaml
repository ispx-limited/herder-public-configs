# Device UI profiles for the cpe-labs simulators, so the demo instance
# and the dev stack show the full section vocabulary on every simulated
# device. The GenericIGD/GenericGateway tuples are the cpe-sim
# alternates (see cpe-sim.yaml); the CpeLabs manufacturer match covers
# the USP fleet sims (SimSub, SimOps, SimUSP), which run TR-181 over
# USP and have no CWMP management surface, so their profile skips the
# canonical.mgmt.* fields.
#
# All three extend their baseline and state only what a simulator does
# differently: it reports fewer identity fields than real hardware, it
# has no neighbour scan to stack beside the radios, and it has neither
# a port-forwarding nor a remote-access module.
apiVersion: deviceprofiles.herder.io/v1alpha1
kind: DeviceProfile
metadata:
  name: cpe-sim-tr098-ui
spec:
  priority: 100
  extends: baseline-tr098-ui
  deviceSelector:
    matchLabels:
      productClass: "GenericIGD"
  dropSections: [port-forwards, remote-access]
  sections:
    - key: status
      title: Device status
      icon: info
      component: form
      config:
        groups:
          - title: Identity
            fields:
              - {label: Manufacturer, canonical: canonical.device.manufacturer}
              - {label: Model, canonical: canonical.device.model_name}
              - {label: Serial number, canonical: canonical.device.serial_number}
              - {label: Firmware, canonical: canonical.device.software_version}
              - {label: Uptime, canonical: canonical.device.uptime, format: duration}
          - title: WAN
            fields:
              - {label: Link status, canonical: canonical.interface.wan.status}
              - {label: WAN IP address, canonical: canonical.interface.wan.ip_address}
    # The radios alone. A simulator publishes no neighbour scan, so the
    # baseline's stack would put an empty pane above the thing being
    # demonstrated.
    - key: wifi
      title: WiFi
      icon: wifi
      component: module
      config:
        module: wifi
---
apiVersion: deviceprofiles.herder.io/v1alpha1
kind: DeviceProfile
metadata:
  name: cpe-sim-tr181-ui
spec:
