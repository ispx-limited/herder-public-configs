# The USP fleet sims: TR-181 over USP, no ManagementServer, so no
# Management form group; everything else is the standard showcase.
apiVersion: deviceprofiles.herder.io/v1alpha1
kind: DeviceProfile
metadata:
  name: cpe-sim-fleet-ui
spec:
  priority: 60
  deviceSelector:
    matchExpressions:
      - key: manufacturer
        operator: In
        values: [CpeLabs]
      - key: "protocol:usp"
        operator: Exists
  sections:
    - key: overview
      title: Overview
      icon: gauge
      component: overview
    - key: status
      title: Device status
      icon: info
      component: form
      config:
        groups:
          - title: Identity
            fields:
              - {label: Manufacturer, canonical: canonical.device.manufacturer}
              - {label: Model, canonical: canonical.device.model_name}
              - {label: Serial number, canonical: canonical.device.serial_number}
              - {label: Firmware, canonical: canonical.device.software_version}
              - {label: Uptime, canonical: canonical.device.uptime, format: duration}
    - key: interfaces
      title: Interfaces
      icon: ethernet-port
      component: ports
      config:
        ports:
          - {id: wan, label: WAN, kind: wan, entity: canonical.interface.wan}
          - {id: lan1, label: "1", kind: ethernet, entity: canonical.interface.lan.1}
          - {id: lan2, label: "2", kind: ethernet, entity: canonical.interface.lan.2}
          - {id: wifi24, label: 2.4 GHz, kind: wifi, entity: canonical.wifi.radio.1}
          - {id: wifi5, label: 5 GHz, kind: wifi, entity: canonical.wifi.radio.2}
    - key: wifi
      title: WiFi
      icon: wifi
      component: module
      config:
        module: wifi
    - key: network-map
      title: Network map
      icon: network
      component: topology
    - key: monitoring
      title: Monitoring
      icon: chart-line
      component: dashboard
      config:
        dashboard: tr181-traffic
    - key: actions
      title: Actions
      icon: zap
      component: actions
    - key: action-log
      title: Action log
      icon: history
      component: tasks
    - key: events
      title: Events
      icon: scroll-text
      component: events
    - key: maintenance
      title: Maintenance
      icon: wrench
      component: maintenance
