# The config check from Herder ADR 0026. Every PR has to answer three
# things before it merges: the bundle validates as an upload would, the
# vendor lint passes, and the resolution for every device in
# .herder/fleet.yaml matches .herder/resolution.golden.yaml.
#
# The last is the one that catches a vendor breaking another vendor. A
# selector that also captures someone else's hardware, an equal-priority
# tie, a telemetry path taken from another profile: each moves a row in
# the golden that is not the row the PR meant to move. A PR that means
# to move a row regenerates the golden (`herder config resolve . --fleet
# .herder/fleet.yaml --golden .herder/resolution.golden.yaml --update`)
# and commits it, and the reviewer reads the golden diff as the change's
# blast radius.
#
# The check runs from the published Herder image so the resolvers are
# the ones a running instance uses, not a copy. The pin is the release
# this bundle ships in; move it when Herder releases.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  HERDER_VERSION: v0.52.0

jobs:
  check:
    name: Validate, lint, resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/ispx-limited/herder-community:${{ env.HERDER_VERSION }}
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Validate and compare to the golden
        run: herder config resolve . --fleet .herder/fleet.yaml --golden .herder/resolution.golden.yaml --quiet >/dev/null
      # Reported, not yet gating: the shipped tree carries the
      # findings this lint was written to catch (Arris rules keyed on
      # the manufacturer alone, dev-sim on an OUI alone). The cleanup
      # PR narrows them, regenerates the golden, and replaces both
      # steps with one `herder config check`, which gates on all three.
      - name: Vendor lint
        continue-on-error: true
        run: herder config lint . --fleet .herder/fleet.yaml --quiet
