# The config check from Herder ADR 0026. Every PR has to answer three
# things before it merges: the bundle validates as an upload would, the
# vendor lint passes, and the resolution for every device in
# .herder/fleet.yaml matches .herder/resolution.golden.yaml.
#
# The last is the one that catches a vendor breaking another vendor. A
# selector that also captures someone else's hardware, an equal-priority
# tie, a telemetry path taken from another profile: each moves a row in
# the golden that is not the row the PR meant to move. A PR that means
# to move a row regenerates the golden (`herder config resolve . --fleet
# .herder/fleet.yaml --golden .herder/resolution.golden.yaml --update`)
# and commits it, and the reviewer reads the golden diff as the change's
# blast radius.
#
# The check runs from a published Herder image so the resolvers are
# the ones a running instance uses, not a copy. The pin is the release
# this bundle ships in; move it when Herder releases. It is the
# community image because that one is public: the job needs no
# credential, so it cannot fail on a revoked token and a pull request
# from a fork runs it like any other.
#
# The community binary is built with garble, and an earlier release of
# it crashed the Go garbage collector about a second into this check.
# v0.52.3 ran it ten times clean against this bundle before the switch;
# if a pin move brings the crash back, the stock image (private, pulled
# with an ispx-issued credential) runs the same check.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Validate, lint, resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # A literal, because the image field cannot read the env context.
      image: ghcr.io/ispx-limited/herder-community:v0.52.3
      options: --user root
    steps:
      - uses: actions/checkout@v4
      # Type-checking every script in the bundle is the expensive part
      # of a load, so the three answers come from one load.
      - name: herder config check
        run: herder config check . --fleet .herder/fleet.yaml --golden .herder/resolution.golden.yaml --quiet
